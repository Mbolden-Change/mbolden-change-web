name: Refresh Substack archive

# Once a month, rebuilds frontend/content/substack-archive.json from our
# Substack (sitemap + posts API) and opens a pull request ONLY when the file
# changed. It never merges: Minh approves that pull request like any other.
#
# New posts already appear on the site within the hour from the feed; this
# keeps the archive file complete, since the feed only holds the latest 20.
#
# Known limit (Nov 2026): Substack answers GitHub's hosted runners with 403,
# so this job fails at "Rebuild the archive" until it runs somewhere Substack
# accepts. See the pull request that added it for the options.
#
# One-time setup: in GitHub → Settings → Actions → General, turn on
# "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    # 1st of each month, 15:17 UTC.
    - cron: '17 15 1 * *'
  # Manual run from the Actions tab. "Dry run" only reports; it opens nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: report changes, open no pull request'
        type: boolean
        default: false
  # A pull request that touches the sync itself gets a dry run as a check.
  pull_request:
    paths:
      - '.github/workflows/refresh-substack-archive.yml'
      - 'frontend/scripts/syncSubstack.mjs'
      - 'frontend/lib/substackPosts/core.ts'

concurrency:
  group: refresh-substack-archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22.18 or newer: the script runs the site's TypeScript cleaner directly.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild the archive
        id: sync
        # With --check nothing is written; either way the step reports
        # "No changes: the archive is current" or lists what changed.
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/syncSubstack.mjs --check --report "$RUNNER_TEMP/substack-report.md"
          else
            node scripts/syncSubstack.mjs --report "$RUNNER_TEMP/substack-report.md"
          fi
          {
            if [ "$DRY_RUN" = "true" ]; then echo "### Dry run (no pull request is opened)"; fi
            cat "$RUNNER_TEMP/substack-report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: env.DRY_RUN != 'true' && steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="substack-archive/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/substack-archive.json
          git commit -m "Refresh the Substack archive"
          git push -u origin "$branch"
          {
            echo "The monthly refresh found changes on our Substack. This updates the archive file the site reads for Our Point of View."
            echo
            echo "Nothing is merged automatically. Check the Vercel preview, then approve as usual."
            echo
            cat "$RUNNER_TEMP/substack-report.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" \
            --title "Refresh the Substack archive ($(date -u +'%B %Y'))" \
            --body-file "$RUNNER_TEMP/pr-body.md"
