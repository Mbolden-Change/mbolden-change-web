          <div className="mb-6 p-4 rounded-xl border-2 transition-all" style={{
            borderColor: caState ? '#0091AD' : 'var(--card-border)',

            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-xl">🏛️</span>

                style={{backgroundColor: caState ? '#0091AD' : '#D1D5DB'}}

                <span className={`inline-block h-5 w-5 transform rounded-full bg-white shadow-md transition-transform duration-200 ${caState ? 'translate-x-6' : 'translate-x-1'}`} />

              <div className="mt-3 pt-3 border-t" style={{borderColor: '#B2F5EA'}}>
                <p className="text-xs" style={{color: '#0D9488'}}>
                  California provides some of the most comprehensive state-level safety net programs in the country — including Medi-Cal coverage regardless of immigration status, CalEITC for ITIN filers, and CalWORKs grants that are among the highest in the nation. These programs meaningfully — though only partially — buffer federal exclusions and cuts. Where the federal tax code shuts ITIN-filing families out, California's credits replace a fraction of the loss, not the whole.
                </p>
                {(household.mixedStatus || household.fullyUndocumented) && (
                  <div className="mt-3 pt-3 border-t" style={{borderColor: '#B2F5EA'}}>

                      Is this family enrolled in Medi-Cal?

                    </p>
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={() => onMedicalEnrollment("all")}

                        </p>
                        <p className="mt-1" style={{color: '#92400E'}}>
                          They still qualify for restricted-scope (emergency) Medi-Cal — covering ER visits, labor and delivery, and emergency dental. This is initiated by hospital billing departments after the fact, not something families sign up for. It keeps them from being turned away, but it is not healthcare.
                        </p>
                      </div>
                    )}
                    {medicalEnrolledPreFreeze === "children-only" && (
                      <div className="text-xs mt-2">
                        <p style={{color: '#D97706'}}>

                        </p>
                        <p className="mt-1" style={{color: '#92400E'}}>
                          The parents still qualify for restricted-scope (emergency) Medi-Cal — ER visits, labor and delivery, and emergency dental only. Initiated by hospital billing, not by application.
                        </p>
                      </div>

                    {medicalEnrolledPreFreeze === "all" && (
                      <p className="text-xs mt-2" style={{color: '#0D9488'}}>
                        The whole family is enrolled in full-scope Medi-Cal. Adults retain coverage as long as they complete annual renewal — but face new $30/month cost-sharing starting July 2027, and dental benefits end July 2026.{household.children > 0 ? " Children's coverage is unaffected by these changes." : ""}
                      </p>

                  </div>

                {household.mixedStatus && !household.fullyUndocumented && household.children > 0 && (
                  <div className="mt-3 pt-3 border-t" style={{borderColor: '#B2F5EA'}}>

                      Has this family applied for CalWORKs for their citizen children?

                    <p className="text-xs text-gray-500 mb-3">
                      US-citizen children of ITIN parents qualify for a child-only CalWORKs cash grant — roughly $900–$1,070/month for a family like this, depending on region — with part of the parents' income counted against it (estimated — the exact amount varies by county). Most mixed-status families never apply: fear of immigration consequences, verification burdens, and inconsistent county handling keep take-up low. The entitlement exists on paper. The design determines whether families ever touch it.

                        onClick={() => onCalworksApplied(false)}

                        style={{
                          backgroundColor: calworksApplied === false || calworksApplied == null ? '#DC2626' : 'white',
                          color: calworksApplied === false || calworksApplied == null ? 'white' : '#DC2626',
                          borderColor: '#DC2626',

                      >
                        No — never applied (most don't)
                      </button>
                    </div>
                    {(calworksApplied === false || calworksApplied == null) && (
                      <p className="text-xs mt-2" style={{color: '#DC2626'}}>
                        The grant this family qualifies for appears on the results screen as an unclaimed entitlement — money the law owes their children that fear and process keep out of their budget.

                    )}
                    {calworksApplied === true && (
                      <p className="text-xs mt-2" style={{color: '#0D9488'}}>

    const GLOSSARY = {
      "SNAP": "Supplemental Nutrition Assistance Program (food stamps)",
      "TANF": "Temporary Assistance for Needy Families (cash aid)",
      "WIC": "Women, Infants, and Children nutrition program",
      "CHIP": "Children\u2019s Health Insurance Program",
      "LIHEAP": "Low Income Home Energy Assistance Program",
      "EITC": "Earned Income Tax Credit (refundable tax credit for low-income workers)",
      "CTC": "Child Tax Credit ($2,200/child for 2025)",
      "ACTC": "Additional Child Tax Credit (refundable portion of the CTC)",
      "ACA": "Affordable Care Act (Obamacare)",
      "ITIN": "Individual Taxpayer Identification Number (used by people without SSNs to file taxes)",
      "SSN": "Social Security Number",
      "MFJ": "Married Filing Jointly (tax filing status)",
      "FPL": "Federal Poverty Level",
      "OBBB": "One Big Beautiful Bill Act (H.R. 1, signed July 4, 2025) \u2014 federal budget reconciliation law with major changes to SNAP, Medicaid, tax credits, and other programs",
      "CBO": "Congressional Budget Office",
      "OAA": "Older Americans Act",
      "EBT": "Electronic Benefits Transfer (card used for SNAP benefits)",
    };
    function glossarize(text) {
      if (!text) return null;
      const pattern = new RegExp(`\\b(${Object.keys(GLOSSARY).join("|")})\\b`, "g");
      const seen = new Set();
      const parts = [];
      let last = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        if (seen.has(match[1])) continue;
        seen.add(match[1]);
        if (match.index > last) parts.push(text.slice(last, match.index));
        parts.push(React.createElement("abbr", { key: match.index, title: GLOSSARY[match[1]], className: "abbr-tooltip" }, match[1]));
        last = match.index + match[1].length;
      }
      if (last < text.length) parts.push(text.slice(last));
      return parts.length > 0 ? parts : text;
    }

    function ProgramInfoBox({ info }) {
      const [open, setOpen] = useState(false);

              <p className="text-sm text-gray-700 leading-relaxed">{glossarize(info)}</p>
            </div>
          )}

    function PolicyRound({ round, household, currentBenefits, onChoice, onContinue, onGoBack }) {
      const [selectedChoices, setSelectedChoices] = useState({});
      const effectiveCutPercent = useMemo(() => getEffectiveCutPercent(round, household), [round, household]);
      const hasPerKeyCut = !!round.perKeyCut;
      const isAffected = hasPerKeyCut || effectiveCutPercent > 0;

      // ─── CA Protection Layer ───────────────────────────────────────────
      const caBuffer = useMemo(() => getCABufferForRound(round.id, household), [round.id, household]);
      const caProtectedKeys = useMemo(() => (caBuffer && caBuffer.protectedKeys) || [], [caBuffer]);
      const caRemovedAreas = useMemo(() => (caBuffer && caBuffer.removedAreas) || [], [caBuffer]);
      const isFullyBuffered = caBuffer && caBuffer.level === "full";

      // Check if any selected tradeoff overrides the cut percent
      const overrideCutPercent = useMemo(() => {
        for (const [area, oid] of Object.entries(selectedChoices)) {
          const opt = (TRADEOFF_OPTIONS[area] || []).find((o) => o.id === oid);
          if (opt && opt.overrideCut !== undefined) return opt.overrideCut;
        }
        return null;
      }, [selectedChoices]);
      const finalCutPercent = overrideCutPercent !== null ? overrideCutPercent : effectiveCutPercent;

      const lostAmount = useMemo(() => {
        const keys = Array.isArray(round.programKey) ? round.programKey : [round.programKey];
        // Exclude CA-protected keys from the loss calculation
        const activeKeys = keys.filter(k => !caProtectedKeys.includes(k));
        if (hasPerKeyCut && overrideCutPercent === null) {
          return activeKeys.reduce((sum, key) => {
            const pct = round.perKeyCut[key] || 0;
            return sum + Math.round((currentBenefits[key] || 0) * (pct / 100));
          }, 0);
        }
        return activeKeys.reduce((sum, key) => sum + Math.round((currentBenefits[key] || 0) * (finalCutPercent / 100)), 0);
      }, [round, currentBenefits, finalCutPercent, hasPerKeyCut, overrideCutPercent, caProtectedKeys]);

      // Remove CA-buffered tradeoff areas from the list
      const relevantAreas = isAffected
        ? round.impactAreas.filter((a) => TRADEOFF_OPTIONS[a] && !caRemovedAreas.includes(a))
        : [];

      // Awareness round
      if (round.isAwarenessRound && round.getAwarenessContent) {
        const aw = round.getAwarenessContent(household);
        const ex = aw.type === "excluded";
        const tradeoffAreas = (aw.forceTradeoff && aw.tradeoffAreas) ? aw.tradeoffAreas.filter(a => TRADEOFF_OPTIONS[a]) : [];
        const hasTradeoff = tradeoffAreas.length > 0;
        const tradeoffSelected = hasTradeoff ? tradeoffAreas.every(a => !!selectedChoices[a]) : true;
        return (
          <div className="py-2">
            <div className={`${ex ? "border-l-4 border-red-500" : "border-l-4 border-blue-400"} rounded-r-xl p-5 mb-6`} style={{backgroundColor: ex ? '#FEF2F2' : '#EFF6FF'}}>
              <h2 className={`text-xl font-bold ${ex ? "text-red-900" : "text-blue-900"} mb-2`} style={{fontFamily: "'Archivo Narrow', sans-serif"}}>{round.title}</h2>
              <p className={`${ex ? "text-red-800" : "text-blue-800"} text-sm leading-relaxed`}>{round.description}</p>
              <div className="mt-3"><span className={`text-xs ${ex ? "text-red-600" : "text-blue-600"}`}>{round.context}</span></div>
            </div>
            <ProgramInfoBox info={round.programInfo} />
            <div className={`${ex ? "bg-purple-50 border-purple-200" : "bg-emerald-50 border-emerald-200"} border rounded-xl p-5 mb-6`}>
              <div className="flex items-start gap-3">
                <span className="text-2xl">{ex ? "\u{1F6AB}" : "\u{1F6E1}\uFE0F"}</span>
                <div>
                  <h3 className={`font-bold ${ex ? "text-purple-900" : "text-emerald-900"} mb-2`}>{aw.heading}</h3>
                  <p className={`text-sm ${ex ? "text-purple-800" : "text-emerald-800"} leading-relaxed`}>{aw.message}</p>
                  {aw.secondaryMessage && <p className={`text-sm ${ex ? "text-purple-700" : "text-emerald-700"} leading-relaxed mt-3 italic`}>{aw.secondaryMessage}</p>}
                </div>
              </div>
            </div>
            {hasTradeoff && (
              <div className="mb-6">
                {aw.tradeoffHeading && <h3 className="font-bold text-gray-900 mb-2">{aw.tradeoffHeading}</h3>}
                {aw.tradeoffSubtext && <p className="text-sm text-gray-500 mb-4">{aw.tradeoffSubtext}</p>}
                {tradeoffAreas.map((area) => {
                  const areaLabels = { food: "Food & Nutrition", healthcare: "Healthcare", housing: "Housing", insurance: "Health Insurance", cashAssistance: "Cash & Basic Needs", utilities: "Utilities", childcare: "Childcare", transportation: "Transportation", medications: "Medications", workRequirement: "Work Requirements", taxCreditLoss: "Coping with Lost Tax Credits", schoolFood: "School Meals & Child Nutrition" };
                  return (
                    <div key={area} className="mb-4">
                      {tradeoffAreas.length > 1 && <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">{areaLabels[area] || area}</p>}
                      <div className="space-y-2">
                        {(TRADEOFF_OPTIONS[area] || []).map((opt) => {
                          const isSel = selectedChoices[area] === opt.id;
                          const sevColors = { 1: "#FACC15", 2: "#FB923C", 3: "#EF4444" };
                          return (
                            <button key={opt.id} onClick={() => setSelectedChoices((p) => ({ ...p, [area]: opt.id }))}
                              className={`w-full text-left p-3 rounded-lg border-2 transition-all text-sm ${isSel ? `severity-${opt.severity}` : "border-gray-100 hover:border-gray-300 bg-white"}`}
                              style={isSel ? {borderColor: sevColors[opt.severity]} : {}}>
                              <div className="flex items-start gap-2">
                                <span className="mt-0.5" style={{color: isSel ? sevColors[opt.severity] : '#9CA3AF'}}>{isSel ? "\u25C9" : "\u25CB"}</span>
                                <div>
                                  <span className="font-medium text-gray-900">{opt.label}</span>
                                  {isSel && <p className="text-gray-500 text-xs mt-1">{opt.detail}</p>}
                                  <SeverityDots severity={opt.severity} />
                                </div>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            <div className="flex items-center justify-center gap-4 mt-6">
              {onGoBack && <button onClick={onGoBack} className="px-5 py-3 rounded-xl font-medium text-sm transition-colors border-2 hover:opacity-80" style={{color: '#0091AD', borderColor: '#0091AD'}}>{"\u2190"} Previous round</button>}
              <button onClick={() => { if (tradeoffSelected) { onChoice(hasTradeoff ? selectedChoices : {}, 0, 0, aw.qualityPenalty || 0); onContinue(); } }}
                disabled={!tradeoffSelected}
                className={`px-8 py-3 rounded-xl font-medium transition-colors ${tradeoffSelected ? "text-white hover:opacity-90" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
                style={tradeoffSelected ? {backgroundColor: '#0091AD'} : {}}>
                {hasTradeoff ? "Confirm choice & next round" : "Next policy round"} {"\u2192"}
              </button>
            </div>
          </div>
        );
      }

      // Unaffected
      if (!isAffected) {
        // For fully undocumented households, "not affected" = "never included" — reframe as exclusion
        const isExclusionFrame = household.fullyUndocumented && !round.isCASpecific;
        const exclusionMessages = {
          "snap-cut": "This family was never eligible for SNAP. No member has a qualified immigration status. The federal food assistance system does not include them.",
          "medicaid-cap": "This family has no federal Medicaid coverage to cut. Undocumented residents are ineligible for Medicaid. In California, they rely on Medi-Cal instead — a state-funded program now facing its own budget pressure.",
          "medicare-medicaid-combined": "This family has neither Medicare nor federal Medicaid. Both programs require qualified immigration status.",
          "medicaid-work-req": "Work requirements don't apply — not because this family is exempt, but because they were never enrolled in federal Medicaid in the first place.",
          "aca-premium-cliff": "This family is ineligible for ACA marketplace coverage. Undocumented residents cannot purchase plans on the exchange, even at full price. They have no access to premium subsidies.",
          "tanf-cut": "This family has never had access to TANF. Cash assistance requires qualified immigration status for the parents.",
          "housing-cut": "This family has never had a housing voucher. Section 8 and public housing require qualified immigration status. They find housing in the private market with no assistance.",
          "oaa-nutrition": "This family is not eligible for Older Americans Act nutrition programs or LIHEAP. These federal programs require qualified immigration status.",
          "liheap-only": "This family is not eligible for LIHEAP. Federal energy assistance requires qualified immigration status. In California, the CARE/FERA utility discount — which has no immigration status requirement — is their only energy cost relief.",
        };
        return (
          <div className="py-2">
            <div className={`border-l-4 ${isExclusionFrame ? "border-purple-400" : "border-blue-400"} rounded-r-xl p-5 mb-6`} style={{backgroundColor: isExclusionFrame ? '#FAF5FF' : '#EFF6FF'}}>
              <h2 className={`text-xl font-bold ${isExclusionFrame ? "text-purple-900" : "text-blue-900"} mb-2`} style={{fontFamily: "'Archivo Narrow', sans-serif"}}>{round.title}</h2>
              <p className={`${isExclusionFrame ? "text-purple-800" : "text-blue-800"} text-sm leading-relaxed`}>{round.description}</p>
              <div className="mt-3"><span className={`text-xs ${isExclusionFrame ? "text-purple-600" : "text-blue-600"}`}>{round.context}</span></div>
            </div>
            <ProgramInfoBox info={round.programInfo} />
            {isExclusionFrame ? (
              <div className="border border-purple-200 rounded-xl p-5 mb-6" style={{backgroundColor: '#FAF5FF', borderLeft: '4px solid #7C3AED'}}>
                <div className="flex items-start gap-3">
                  <span className="text-2xl">{"\u{1F6AB}"}</span>
                  <div>
                    <h3 className="font-bold text-purple-900 mb-2">Not affected — because this family was never included</h3>
                    <p className="text-sm text-purple-800 leading-relaxed">{exclusionMessages[round.id] || "This family has no access to this federal program. Undocumented residents are excluded from most federal benefits regardless of how long they've lived, worked, and paid taxes in the United States."}</p>
                  </div>
                </div>
              </div>
            ) : (
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-5 mb-6">
                <div className="flex items-start gap-3">
                  <span className="text-2xl">{"\u{1F6E1}\uFE0F"}</span>
                  <div>
                    <h3 className="font-bold text-emerald-900 mb-2">Your household is not directly affected</h3>
                    <p className="text-sm text-emerald-800 leading-relaxed">{round.unaffectedMessage || "This policy change doesn't directly impact your household's benefits."}</p>
                  </div>
                </div>
              </div>
            )}
            <div className="flex items-center justify-center gap-4 mt-6">
              {onGoBack && <button onClick={onGoBack} className="px-5 py-3 rounded-xl font-medium text-sm transition-colors border-2 hover:opacity-80" style={{color: '#0091AD', borderColor: '#0091AD'}}>{"\u2190"} Previous round</button>}
              <button onClick={() => { onChoice({}, 0, 0); onContinue(); }} className="text-white px-8 py-3 rounded-xl font-medium hover:opacity-90 transition-colors" style={{backgroundColor: '#0091AD'}}>Next policy round {"\u2192"}</button>
            </div>
          </div>
        );
      }

      // Affected
      const noTradeoffsNeeded = relevantAreas.length === 0;
      const allSelected = noTradeoffsNeeded || Object.keys(selectedChoices).length >= relevantAreas.length;
      return (
        <div className="py-2">
          <div className={`${round.isBudgetPressure ? "border-l-4 border-amber-500" : "border-l-4 border-red-500"} rounded-r-xl p-5 mb-6`} style={{backgroundColor: round.isBudgetPressure ? '#FFFBEB' : '#FEF2F2'}}>
            {round.isBudgetPressure && <span className="inline-block bg-amber-200 text-amber-800 text-xs font-bold px-2 py-0.5 rounded mb-2 uppercase tracking-wide">Budget Pressure Scenario — Not a direct OBBB provision</span>}
            <h2 className={`text-xl font-bold ${round.isBudgetPressure ? "text-amber-900" : "text-red-900"} mb-2`} style={{fontFamily: "'Archivo Narrow', sans-serif"}}>{round.title}</h2>
            <p className={`${round.isBudgetPressure ? "text-amber-800" : "text-red-800"} text-sm leading-relaxed`}>{round.description}</p>
            <div className="mt-3 flex items-center gap-3 flex-wrap">
              <span className={`px-3 py-1 rounded-lg text-sm font-bold transition-all ${finalCutPercent === 100 ? "bg-red-200 text-red-800" : "bg-red-100 text-red-700"}`} title={`This ${finalCutPercent}% models the combined effect of multiple provisions. Individual household impacts will vary.`}>{"\u2212"}{formatMoney(lostAmount)}/month</span>
              {finalCutPercent === 100 && <span className="bg-red-200 text-red-800 px-3 py-1 rounded-lg text-sm font-bold animate-pulse">TOTAL LOSS</span>}
              <span className="text-xs text-red-600">{round.context}</span>
            </div>
          </div>
          <ProgramInfoBox info={round.programInfo} />
          {/* ── CA Protection Callout (Full Buffer) ── */}
          {caBuffer && caBuffer.level === "full" && caBuffer.callout && (
            <div className="rounded-xl p-5 mb-6" style={{backgroundColor: '#ECFDF5', border: '1px solid #A7F3D0', borderLeft: '4px solid #059669'}}>
              <div className="flex items-start gap-3">
                <span className="text-xl mt-0.5">{"\u{1F6E1}\uFE0F"}</span>
                <div>
                  <h4 className="text-xs font-semibold uppercase tracking-wider mb-1" style={{color: '#059669', fontFamily: "'Archivo Narrow', sans-serif"}}>California Protects</h4>
                  <p className="text-sm leading-relaxed mb-1" style={{color: '#065F46'}}>{caBuffer.callout}</p>
                  {caBuffer.note && <p className="text-xs leading-relaxed mt-2 italic" style={{color: '#047857'}}>{caBuffer.note}</p>}
                </div>
              </div>
            </div>
          )}
          {/* ── CA Buffer Callout (Partial / Narrative) ── */}
          {household.caState && (!caBuffer || caBuffer.level !== "full") && (() => {
            const bufferMessages = [];
            const keys = Array.isArray(round.programKey) ? round.programKey : [round.programKey];

            // Show config-based callout for partial buffers
            if (caBuffer && caBuffer.level === "partial" && caBuffer.callout) {
              bufferMessages.push(caBuffer.callout);
            }

            // Narrative messages based on program keys and household characteristics
            if (keys.includes("snap") && household.mixedStatus) {
              bufferMessages.push("In California, the California Food Assistance Program (CFAP) provides CalFresh-equivalent benefits to some lawfully present immigrants excluded from federal SNAP. However, undocumented residents are not currently covered by CFAP.");
            }
            if (keys.includes("medicaid") || keys.includes("childMedicaid") || keys.includes("medicalExpansion")) {
              if (household.mixedStatus) {
                bufferMessages.push("California's Medi-Cal expansion covers all income-eligible residents regardless of immigration status — providing a crucial buffer for mixed-status families when federal Medicaid is cut. However, this state coverage faces its own budget pressure.");
              } else {
                bufferMessages.push("California's Medi-Cal program may absorb some coverage losses by maintaining broader eligibility than federal minimum requirements, but state budget constraints from the OBBB's cost-shifting limit this buffer.");
              }
            }
            if ((keys.includes("tanf") || keys.includes("calworks")) && household.caBenefits && household.caBenefits.calworksBoost) {
              bufferMessages.push("CalWORKs provides higher cash grants than federal TANF minimums — " + formatMoney(household.caBenefits.calworksBoost) + "/month above what federal TANF alone would provide. This state supplement partially cushions the erosion.");
            }
            if (keys.includes("liheap") && household.caBenefits && household.caBenefits.careDiscount && !(caBuffer && caBuffer.callout)) {
              bufferMessages.push("California's CARE program provides a 32.5% discount on electricity bills — a separate state program that partially offsets LIHEAP cuts.");
            }

            if (bufferMessages.length === 0) return null;

            return (
              <div className="rounded-xl p-4 mb-6" style={{backgroundColor: '#F0FDFA', border: '1px solid #B2F5EA', borderLeft: '4px solid #0091AD'}}>
                <div className="flex items-start gap-2">
                  <span className="text-sm mt-0.5">{"\u{1F3DB}\uFE0F"}</span>
                  <div>
                    <h4 className="text-xs font-semibold uppercase tracking-wider mb-1" style={{color: '#0D9488', fontFamily: "'Archivo Narrow', sans-serif"}}>California Buffer</h4>
                    {bufferMessages.map((msg, i) => (
                      <p key={i} className="text-xs leading-relaxed mb-1" style={{color: '#0F766E'}}>{msg}</p>
                    ))}
                  </div>
                </div>
              </div>
            );
          })()}
          {relevantAreas.length > 0 && (
          <div className="mb-6">
            <h3 className="font-bold text-gray-900 mb-1">What does this family sacrifice?</h3>
            <p className="text-sm text-gray-500 mb-4">Choose one tradeoff in each area. There are no good options.</p>
          </div>
          )}
          <div className="space-y-6">
            {relevantAreas.map((area) => (
              <div key={area}>
                <h4 className="font-semibold text-gray-700 capitalize mb-1 text-sm tracking-wide">{({ healthcare: "Healthcare", workRequirement: "Work Verification", medications: "Medications", insurance: "Insurance", cashAssistance: "Losing Cash Assistance", utilities: "Utilities", taxCreditLoss: "Coping with Lost Tax Credits", schoolFood: "School Meals & Child Nutrition" })[area] || area.charAt(0).toUpperCase() + area.slice(1)}</h4>
                {round.areaSubtitles && round.areaSubtitles[area] && <p className="text-xs text-gray-400 mb-2 italic">{round.areaSubtitles[area]}</p>}
                <div className="space-y-2">
                  {(TRADEOFF_OPTIONS[area] || []).map((opt) => {
                    const isSel = selectedChoices[area] === opt.id;
                    const sevClass = isSel ? `severity-${opt.severity}` : "";
                    const sevColors = { 1: "#FACC15", 2: "#FB923C", 3: "#EF4444" };
                    return (
                      <button key={opt.id} onClick={() => setSelectedChoices((p) => ({ ...p, [area]: opt.id }))}
                        className={`v2-tradeoff-card ${isSel ? `selected sev-${opt.severity}` : ""}`}>
                        <div className="flex items-start gap-3">
                          <span className="mt-0.5 text-lg" style={{color: isSel ? sevColors[opt.severity] : '#d4cabb'}}>{isSel ? "\u25C9" : "\u25CB"}</span>
                          <div className="flex-1">
                            <span className="font-medium" style={{color: '#1a1a1a'}}>{opt.label}</span>
                            <div className={`v2-tradeoff-detail ${isSel ? 'open' : ''}`}>
                              <p className="text-xs mt-2" style={{color: '#777'}}>{opt.detail}</p>
                            </div>
                            <div className="mt-1"><SeverityDots severity={opt.severity} /></div>
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          <div className="flex items-center justify-center gap-4 mt-8">
            {onGoBack && <button onClick={onGoBack} className="px-5 py-3 rounded-xl font-medium text-sm transition-colors border-2 hover:opacity-80" style={{color: '#0091AD', borderColor: '#0091AD'}}>{"\u2190"} Previous round</button>}
            <button onClick={() => { if (allSelected) { onChoice(selectedChoices, lostAmount, finalCutPercent); onContinue(); } }} disabled={!allSelected}
              className={`px-8 py-3 rounded-xl font-medium transition-colors ${allSelected ? "text-white hover:opacity-90" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
              style={allSelected ? {backgroundColor: '#0091AD'} : {}}>
              {noTradeoffsNeeded ? "Next policy round" : "Confirm tradeoffs & next round"} {"\u2192"}
            </button>
          </div>
        </div>
      );
    }

    function QolChart({ history }) {
      if (!history || history.length < 2) return null;
      const W = 600, H = 210, PAD = { t: 20, r: 20, b: 70, l: 45 };
      const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;
      const pts = history.map((h, i) => ({
        x: PAD.l + (i / (history.length - 1)) * cw,
        y: PAD.t + (1 - h.score / 100) * ch,
        score: h.score, label: h.label,
      }));
      const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
      const areaD = pathD + ` L${pts[pts.length - 1].x},${PAD.t + ch} L${pts[0].x},${PAD.t + ch} Z`;
      return (
        <div className="rounded-xl p-4 mb-6" style={{background: 'var(--card-bg)', border: '1px solid var(--card-border)'}}>
          <div className="pre-header mb-1" style={{color: '#0091AD'}}>HOUSEHOLD STABILITY TRAJECTORY</div>
          <p className="text-xs text-gray-400 mb-3">Each point represents a new round of cuts to safety net programs</p>
          <div className="qol-chart-wrap">
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight: '230px'}} role="img" aria-label="Household stability trajectory chart showing score changes across policy rounds">
            <defs>
              <linearGradient id="qolGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#0091AD" stopOpacity="0.2" />
                <stop offset="100%" stopColor="#0091AD" stopOpacity="0.02" />
              </linearGradient>
            </defs>
            {[0, 25, 50, 75, 100].map((v) => {
              const y = PAD.t + (1 - v / 100) * ch;
              return <g key={v}><line x1={PAD.l} y1={y} x2={W - PAD.r} y2={y} stroke="#E5E7EB" strokeWidth="1" /><text x={PAD.l - 8} y={y + 4} textAnchor="end" fontSize="10" fill="#9CA3AF">{v}%</text></g>;
            })}
            <path d={areaD} fill="url(#qolGrad)" />
            <path d={pathD} fill="none" stroke="#0091AD" strokeWidth="2.5" strokeLinejoin="round" />
            {pts.map((p, i) => (
              <g key={i}>
                <circle cx={p.x} cy={p.y} r={i === 0 ? 5 : i === pts.length - 1 ? 6 : 4} fill={i === pts.length - 1 ? (p.score > 50 ? '#0091AD' : p.score > 25 ? '#FB923C' : '#EF4444') : '#0091AD'} stroke="white" strokeWidth="2" />
                <text x={i === 0 ? p.x + 14 : p.x} y={i === 0 ? p.y - 2 : p.y - 10} textAnchor={i === 0 ? "start" : "middle"} fontSize="10" fontWeight="bold" fill={i === pts.length - 1 ? '#000' : '#666'}>{Math.round(p.score)}%</text>
                <text x={p.x} y={PAD.t + ch + 14} textAnchor="middle" fontSize="8" fill="#9CA3AF">{i === 0 ? "Start" : `Round ${i}`}</text>
                {p.label && p.label !== "Start" && <text x={p.x} y={PAD.t + ch + 24} textAnchor="middle" fontSize="7" fill="#B0B0B0">{p.label.length > 12 ? p.label.slice(0, 11) + "\u2026" : p.label}</text>}
              </g>
            ))}
          </svg>
          </div>
        </div>
      );
    }

    function ResultsScreen({ household, region, finalBenefits, finalScore, allChoices, skippedRounds, rounds, qolHistory, onRestart }) {
      const originalBenefits = getBenefitTotal(household.benefits);
      const remainingBenefits = getBenefitTotal(finalBenefits);
      const totalLost = originalBenefits - remainingBenefits;
      const percentLost = Math.round((totalLost / (originalBenefits || 1)) * 100);
      const allTradeoffs = allChoices.flatMap((cs) => Object.entries(cs).map(([area, oid]) => {
        const opt = (TRADEOFF_OPTIONS[area] || []).find((o) => o.id === oid);
        return opt ? { area, ...opt } : null;
      }).filter(Boolean)).filter((t, i, arr) => arr.findIndex((x) => x.id === t.id) === i);

      return (
        <div>
          {/* Results header — full-bleed black */}
          <div className="v2-section" style={{background: '#000', paddingTop: '64px', paddingBottom: '48px'}}>
            <div className="v2-section-inner-wide text-center">
              <div className="pre-header mb-3" style={{color: '#FAD826'}}>SIMULATION COMPLETE</div>
              <h2 className="text-3xl font-bold text-white mb-1" style={{fontFamily: "'Archivo Narrow', sans-serif"}}>{household.name}</h2>
              {region && region.id !== "national-avg" && <p className="text-xs mt-1" style={{color: '#666'}}>Region: {region.name}</p>}
            </div>
          </div>

          {/* Receipt-style summary */}
          <div className="v2-section v2-section-cream">
            <div className="v2-section-inner">
              <div className="v2-receipt">
                <div className="text-center mb-6">
                  <div className="pre-header mb-1" style={{color: '#B22F93'}}>THE COST</div>
                  <p className="text-xs" style={{color: '#999'}}>What this family lost</p>
                </div>
                <div className="v2-receipt-line">
                  <span style={{color: '#777'}}>Support lost / month</span>
                  <span style={{color: '#EF4444', fontWeight: 700, fontFamily: "'Archivo Narrow', sans-serif", fontSize: '18px'}}>{formatMoney(totalLost)}</span>
                </div>
                <div className="v2-receipt-line">
                  <span style={{color: '#777'}}>Safety net cut</span>
                  <span style={{color: '#92400E', fontWeight: 700, fontFamily: "'Archivo Narrow', sans-serif", fontSize: '18px'}}>{percentLost}%</span>
                </div>
                <div className="v2-receipt-line">
                  <span style={{color: '#777'}}>Household stability</span>
                  <span style={{color: finalScore > 50 ? '#0091AD' : finalScore > 25 ? '#FB923C' : '#EF4444', fontWeight: 700, fontFamily: "'Archivo Narrow', sans-serif", fontSize: '18px'}}>{Math.round(finalScore)}%</span>
                </div>
                <div className="v2-receipt-total">
                  <span>Annual impact</span>
                  <span style={{color: '#EF4444'}}>{formatMoney(totalLost * 12)}/year</span>
                </div>
                <div className="text-center mt-4">
                  <p className="text-xs" style={{color: '#bbb', fontFamily: 'monospace'}}>Generated {new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</p>
                </div>
              </div>
            </div>
          </div>

          <div className="v2-section v2-section-white">
            <div className="v2-section-inner-wide">
          <QolChart history={qolHistory} />
          <QualityOfLifeMeter score={finalScore} label="Final Household Stability" showDefinition={true} />

          <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8">
          {allTradeoffs.length > 0 && (
            <div>
              <div className="pre-header mb-2" style={{color: '#EF4444'}}>IMPOSSIBLE CHOICES</div>
              <h3 className="font-bold mb-4" style={{fontFamily: "'Archivo Narrow', sans-serif", fontSize: '1.25rem'}}>The tradeoffs this family was forced to make:</h3>
              <div className="space-y-3">{allTradeoffs.map((t, i) => {
                const sevBorderColors = { 1: "#FACC15", 2: "#FB923C", 3: "#EF4444" };
                return (
                <div key={i} className="bg-white rounded-lg p-4 border-l-4 flex items-start gap-3" style={{borderLeftColor: sevBorderColors[t.severity], borderTop: '1px solid #f3f4f6', borderRight: '1px solid #f3f4f6', borderBottom: '1px solid #f3f4f6'}}>
                  <div className="shrink-0 mt-1"><SeverityDots severity={t.severity} /></div>
                  <div><p className="text-sm font-medium text-gray-900">{t.label}</p><p className="text-xs text-gray-500 mt-0.5">{t.detail}</p></div>
                </div>
              );})}</div>
            </div>
          )}

          {skippedRounds.length > 0 && (
            <div>
              <div className="pre-header mb-2" style={{color: '#0091AD'}}>NOT DIRECTLY AFFECTED</div>
              <h3 className="font-bold mb-4" style={{fontFamily: "'Archivo Narrow', sans-serif", fontSize: '1.25rem'}}>Policies that didn't affect your household:</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{skippedRounds.map((rid, i) => {
                const r = rounds.find((x) => x.id === rid);

                      <p>Community Eligibility Provision threshold change: 1.4 million children affected. WIC serves ~6.7 million participants. School meal estimates for preset households include pre-K and Head Start programs where applicable; the custom household eligibility engine uses ages 5\u201318 as a simplified threshold. Sources: USDA-FNS, FRAC, Urban Institute.</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">OAA &amp; LIHEAP</p>
                      <p>LIHEAP serves ~6.7 million households. Meals on Wheels serves 2.6 million seniors; 1 in 3 providers has a waitlist. Sources: ACL, HHS, NEADA, Meals on Wheels America 2025 Provider Report.</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">Immigration fiscal contributions</p>
                      <p>Undocumented immigrants contribute an estimated $25.6B/year to Social Security and $6.4B to Medicare (based on 2022 tax data). Source: Institute on Taxation and Economic Policy (ITEP), 2024.</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">Household income levels</p>
                      <p>Preset household incomes reflect below-median wages for each occupation, consistent with the low-income households this simulator models. Maria ($1,680/mo) earns below the BLS median for home health aides ($16.78/hr median, May 2024) working 30 hours/week. The Johnsons ($3,200/mo combined) reflect entry-level warehouse and part-time retail. The Ramirez family ($2,200/mo combined) reflects wages typical of undocumented workers in landscaping and domestic work at national baseline rates; the $11\u201314/hour range reflects cash-pay arrangements common in the informal economy. The Chen family ($2,200/mo combined) reflects restaurant kitchen and garment shop wages typical of recently arrived undocumented Chinese immigrants. Both families are set at income levels representative of the 3.6 million California households that qualify for CalEITC when the CA toggle is active. James and Dorothy ($2,340/mo) reflect below-average Social Security benefits typical of low-income careers without pensions. Income is held constant across non-California regions \u2014 federal benefit levels do not adjust for local wages or cost of living, and this gap is part of what the simulator illustrates. Sources: BLS Occupational Employment and Wage Statistics (May 2024), SSA benefit data, CalEITC Coalition data (2024).</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">Regional cost adjustments</p>
                      <p>Housing and cost-of-living multipliers derived from FY2025 HUD Fair Market Rents and 2023 BEA Regional Price Parities. Sources: HUD FMR data, BEA RPP tables.</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">Housing eligibility</p>
                      <p>Housing voucher eligibility uses a simplified national proxy (~$35,000/year AMI for a family of 4, scaled by household size) as an approximate 50% Area Median Income gate. Actual HUD AMI varies significantly by county and metropolitan area. Preset households use curated housing benefit values based on their narrative circumstances.</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">California state programs</p>
                      <p>CalWORKs Maximum Aid Payment levels per CDSS ACL 26-66 (effective October 1, 2026, a 1.8% increase under AB 152). Grants equal MAP minus countable income after the $600 + 50% earned income disregard (ACL 21-130); child-only grants for citizen children of excluded parents use an MBSAC-differential deeming approximation (MPP 44-133.2) and are labeled as estimates \— county practices vary. Medi-Cal expansion per SB 75 (children, 2016), AB 133 (50+, 2022), SB 184 (all ages, Jan 2024); Medi-Cal income thresholds are computed as annual FPL \÷ 12 rather than DHCS's chart-rounded monthly values (maximum deviation under $3/month, always on the stricter side). CalEITC and YCTC per FTB 2025 tax year guidance: CalEITC amounts come from the official FTB Form 3514 lookup table (income limit $32,900; maximum credits $302/$2,016/$3,339/$3,756 by number of children); YCTC provides up to $1,189 per return for a qualifying child under 6, phasing out at $21.71 per $100 of earned income above $27,425; ITIN filers eligible per AB 1876 (2020). CARE/FERA income limits per CPUC 2025-2026 schedule; CARE provides approximately 32.5% discount on electric and 20% on gas. California Universal Meals Program (AB 130, 2021) provides free breakfast and lunch to all TK-12 public school students regardless of income or immigration status. CAPI payment standards per CDSS January 2025 schedule.</p>
                      <p className="mt-1"><strong>Medi-Cal enrollment freeze:</strong> Per 2025-26 budget trailer bill language, effective January 1, 2026, new full-scope Medi-Cal enrollment for undocumented adults age 19 and older was frozen. Children under 19 and pregnant individuals can still enroll regardless of immigration status. Existing adult enrollees retain full-scope coverage if they complete annual renewal but face new cost-sharing ($30/month starting July 2027) and loss of dental benefits (July 2026). All undocumented adults — including those who did not enroll before the freeze — remain eligible for restricted-scope (emergency) Medi-Cal, which covers ER visits, labor and delivery, and emergency dental; this is initiated retroactively by hospital billing departments. The simulator asks users to specify the family's enrollment status (whole family enrolled, children only, or no one enrolled) when the California toggle is active for undocumented or mixed-status households. Sources: DHCS, CDSS, FTB, CPUC, CDE, California Budget Center, BLS OEWS.</p>
                      <p className="mt-1">When the California toggle is active, preset household incomes are adjusted upward by a sub-region-specific multiplier reflecting higher California wages. Documented workers receive the full regional multiplier (10\u201330%), derived from BLS Occupational Employment and Wage Statistics (May 2024) comparing California metro-area wages to national medians. Undocumented and mixed-status workers receive 50% of the regional wage premium: market forces (cost of living, competition for labor in tight markets) push wages up even in cash-pay arrangements, but wage theft, sub-minimum-wage pay, and inability to file labor complaints mean these workers capture only a fraction of the documented wage premium. For example, Bay Area documented workers receive the full 30% premium while undocumented/mixed-status workers receive a 15% premium. This ensures the Ramirez and Chen families remain representative of the approximately 900,000 Bay Area households and 3.6 million statewide households that qualify for CalEITC (CalEITC Coalition, 2024). Custom household incomes are not adjusted.</p>
                    </div>
                    <div>
                      <p className="font-semibold text-gray-700 mb-1">Methodology note</p>
                      <p>Stability scores are illustrative, not predictive. They reflect cumulative tradeoff severity across rounds. Cut percentages are modeled estimates based on CBO scoring and policy analysis, not exact statutory reduction rates \u2014 actual impacts will vary by state and individual circumstances. Some provisions (e.g., state SNAP cost-sharing) phase in through FY2028; this simulator compresses projected 10-year impacts into a single simulation for educational purposes. Budget-pressure scenarios (TANF, Housing) are labeled separately as they are not direct OBBB provisions. The simulator does not dynamically recalculate benefits when tradeoff choices affect income. Housing voucher amounts reflect HUD formulas where higher income reduces the subsidy \u2014 larger families with higher earnings may receive smaller vouchers than smaller households. All dollar figures are monthly unless noted.</p>
                      <p className="mt-1">California offers child-only CalWORKs grants to citizen children in mixed-status families when their parents are excluded from the assistance unit. The simulator models these grants: parental income is deemed to the children's assistance unit after earned-income disregards and an allocation for the excluded parents' needs (an MBSAC-differential approximation of MPP 44-133.2 \— county practices vary). Because take-up among mixed-status families is documented to be low, the tool asks whether the family has applied; unclaimed grants are shown as an unclaimed entitlement rather than counted as income.</p>
                      <p className="mt-1">For fully undocumented households, the simulator models exclusion from all federal programs that require qualified immigration status (SNAP, Medicaid, TANF, housing vouchers, LIHEAP, EITC, CTC). Only programs with no status verification (WIC, school meals) are available federally. Rounds that do not affect these families are presented with an exclusion frame ("not affected — because this family was never included") rather than as protection. In California, the three-way Medi-Cal enrollment question produces different benefit values: "whole family" uses the full calculated Medi-Cal value, "children only" uses children's coverage only ($300/child/month), and "no one enrolled" zeros out the benefit entirely. Emergency Medi-Cal is noted but not assigned a dollar value because it cannot be budgeted around.</p>
                    </div>
                  </div>
                )}
              </div>
            );
          })()}

          <div className="mt-6 mb-2 text-left">
            <p className="text-xs" style={{color: '#999'}}>mBOLDen Change is a 501(c)(3) nonprofit. <a href="https://www.mboldenchange.org/" target="_blank" rel="noopener noreferrer" className="underline hover:opacity-70" style={{color: '#999'}}>Donations help us champion, design, and incubate bold, community-driven solutions and build more tools like this.</a></p>
          </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────

    function App() {
      const [screen, setScreen] = useState("intro");
      const [household, setHousehold] = useState(null);
      const [region, setRegion] = useState(null);
      const [adjustedExpenses, setAdjustedExpenses] = useState({});
      const [currentRound, setCurrentRound] = useState(0);
      const [currentBenefits, setCurrentBenefits] = useState({});
      const [qualityScore, setQualityScore] = useState(100);
      const [allChoices, setAllChoices] = useState([]);
      const [skippedRounds, setSkippedRounds] = useState([]);
      const [qolHistory, setQolHistory] = useState([]);
      const [roundSnapshots, setRoundSnapshots] = useState([]);
      const [hasCompletedSim, setHasCompletedSim] = useState(false);
      const [caState, setCaState] = useState(false);
      const [medicalEnrolledPreFreeze, setMedicalEnrolledPreFreeze] = useState(null); // null = unanswered, "all" | "children-only" | "none"
      const [calworksApplied, setCalworksApplied] = useState(null); // null = unanswered (treated as not applied for mixed-status)

      useEffect(() => { setTimeout(() => { window.scrollTo(0, 0); }, 50); }, [screen, currentRound]);

      const restart = useCallback(() => {
        setScreen("select"); setHousehold(null); setRegion(null); setAdjustedExpenses({});
        setCurrentRound(0); setCurrentBenefits({}); setQualityScore(100); setAllChoices([]); setSkippedRounds([]); setQolHistory([]); setRoundSnapshots([]); setCaState(false); setMedicalEnrolledPreFreeze(null); setCalworksApplied(null);
      }, []);

      const selectHousehold = useCallback((hh) => {
        let selectedHH = hh;
        if (hh.isCustom && caState) {
          selectedHH = applyCALayer(hh, hh.customRegion || REGIONS.find(r => r.id === "national-avg"), { medicalEnrolledPreFreeze, calworksApplied });
        }
        setHousehold(selectedHH);
        if (selectedHH.isCustom) {
          // Custom households have region-adjusted expenses already baked in
          const region = selectedHH.customRegion || REGIONS.find(r => r.id === "national-avg");
          setRegion(region);
          setAdjustedExpenses({ ...selectedHH.expenses });
          setCurrentBenefits({ ...selectedHH.benefits });
          const bq = selectedHH.baselineQuality || 100;
          const caBonus = caState ? Math.min(8, Object.keys(selectedHH.caBenefits || {}).filter(k => (selectedHH.caBenefits[k] || 0) > 0).length * 2) : 0;
          const adjustedBq = Math.min(97, bq + caBonus);
          setQualityScore(adjustedBq);
          setAllChoices([]);
          setSkippedRounds([]);
          setQolHistory([{ label: "Start", score: adjustedBq }]);
          setCurrentRound(0);
          setScreen("householdIntro");
        } else {
          setScreen("regionSelect");
        }
      }, [caState, medicalEnrolledPreFreeze, calworksApplied]);

      const rounds = useMemo(() => {
        if (!household) return POLICY_ROUNDS;
        let applicableRounds = POLICY_ROUNDS.filter((r) => !r.appliesTo || r.appliesTo(household));
        if (caState && household) {
          const caRounds = CA_POLICY_ROUNDS.filter((r) => !r.appliesTo || r.appliesTo(household));
          applicableRounds = [...applicableRounds, ...caRounds];
        }
        return applicableRounds;
      }, [household, caState]);

      const selectRegion = useCallback((r) => {
        setRegion(r);
        let hh = household;
        if (caState) {
          hh = applyCALayer(household, r, { medicalEnrolledPreFreeze, calworksApplied });
          setHousehold(hh);
        }
        const adj = adjustExpenses(hh.expenses, r);
        setAdjustedExpenses(adj);
        setCurrentBenefits({ ...hh.benefits });
        const bq = hh.baselineQuality || 100;
        // CA safety net provides a small stability buffer
        const caBonus = caState ? Math.min(8, Object.keys(hh.caBenefits || {}).filter(k => (hh.caBenefits[k] || 0) > 0).length * 2) : 0;
        const adjustedBq = Math.min(97, bq + caBonus);
        setQualityScore(adjustedBq); setAllChoices([]); setSkippedRounds([]); setQolHistory([{ label: "Start", score: adjustedBq }]); setCurrentRound(0);
        setScreen("householdIntro");
      }, [household, caState, medicalEnrolledPreFreeze, calworksApplied]);

      const handleRoundChoice = useCallback((choices, lostAmount, effectiveCut, awarenessQualityPenalty = 0) => {
        setRoundSnapshots((prev) => [...prev, { benefits: { ...currentBenefits }, quality: qualityScore, choices: [...allChoices], skipped: [...skippedRounds], history: [...qolHistory] }]);
        const round = rounds[currentRound];
        const keys = Array.isArray(round.programKey) ? round.programKey : [round.programKey];

        // CA protection: determine which keys are shielded from cuts
        const caBuffer = getCABufferForRound(round.id, household);
        const caProtectedKeys = (caBuffer && caBuffer.protectedKeys) || [];
        const activeKeys = keys.filter(k => !caProtectedKeys.includes(k));

        if (effectiveCut === 0 && !round.perKeyCut) {
          const wasAffected = awarenessQualityPenalty > 0 || Object.keys(choices).length > 0;
          if (!wasAffected) setSkippedRounds((p) => [...p, round.id]);
          setAllChoices((p) => [...p, choices]);
          if (awarenessQualityPenalty > 0) setQualityScore((p) => Math.max(0, p - awarenessQualityPenalty));
          const tradeoffPenalty = Object.entries(choices).reduce((s, [a, oid]) => {
            const opt = (TRADEOFF_OPTIONS[a] || []).find((o) => o.id === oid);
            return s + (opt ? opt.severity * 4 : 0);
          }, 0);
          if (tradeoffPenalty > 0) setQualityScore((p) => Math.max(0, p - tradeoffPenalty));
          return;
        }
        setCurrentBenefits((prev) => {
          const next = { ...prev };
          if (round.perKeyCut) {
            activeKeys.forEach((k) => { const pct = round.perKeyCut[k] || 0; if (next[k] !== undefined) next[k] = Math.max(0, Math.round(next[k] * (1 - pct / 100))); });
          } else {
            activeKeys.forEach((k) => { if (next[k] !== undefined) next[k] = Math.max(0, Math.round(next[k] * (1 - effectiveCut / 100))); });
          }
          return next;
        });
        const penalty = Object.entries(choices).reduce((s, [a, oid]) => {
          const opt = (TRADEOFF_OPTIONS[a] || []).find((o) => o.id === oid);
          return s + (opt ? opt.severity * 4 : 0);
        }, 0);
        setQualityScore((p) => Math.max(0, p - penalty));
        setAllChoices((p) => [...p, choices]);
      }, [currentRound, rounds, currentBenefits, qualityScore, allChoices, skippedRounds, qolHistory, household]);

      const advanceRound = useCallback(() => {
        setQolHistory((h) => [...h, { label: rounds[currentRound]?.chartLabel || rounds[currentRound]?.title?.split(" ")[0] || `R${currentRound + 1}`, score: qualityScore }]);
        if (currentRound + 1 >= rounds.length) { setScreen("results"); setHasCompletedSim(true); }
        else setCurrentRound((r) => r + 1);
      }, [currentRound, rounds, qualityScore]);

      const goBackRound = useCallback(() => {
        if (currentRound === 0 || roundSnapshots.length === 0) return;
        const snap = roundSnapshots[roundSnapshots.length - 1];
        setCurrentBenefits(snap.benefits);
        setQualityScore(snap.quality);
        setAllChoices(snap.choices);
        setSkippedRounds(snap.skipped);
        setQolHistory(snap.history);
        setRoundSnapshots((p) => p.slice(0, -1));
        setCurrentRound((r) => r - 1);
      }, [currentRound, roundSnapshots]);

      const expenseTotal = household ? getExpenseTotal(adjustedExpenses) : 0;
      const benefitTotal = household ? getCashBenefitTotal(currentBenefits) : 0;

      // Sticky bar color logic
      const stickyBarColor = qualityScore > 50 ? '#0091AD' : qualityScore > 25 ? '#FB923C' : '#EF4444';
      const showStickyBar = screen === "round" && household;

      return (
        <React.Fragment>
          {/* V2: Sticky stability bar */}
          <div className={`v2-sticky-bar ${showStickyBar ? 'visible' : ''}`}>
            <span className="v2-sticky-bar-label">{household ? household.name : ''}</span>
            <div className="v2-sticky-bar-track">
              <div className="v2-sticky-bar-fill" style={{width: `${Math.max(qualityScore, 2)}%`, backgroundColor: stickyBarColor}} />
            </div>
            <span className="v2-sticky-bar-score" style={{color: stickyBarColor}}>
              <span style={{color: '#999', fontWeight: 400, fontSize: '10px', letterSpacing: '0.08em', marginRight: '6px'}}>STABILITY</span>
              {Math.round(qualityScore)}%
            </span>
          </div>

          <main id="main-content" role="main" className="min-h-screen" style={{backgroundColor: screen === 'intro' ? '#000' : '#F8EFE0'}}>
            {screen !== "intro" && (
              <div className="max-w-5xl mx-auto px-4 pt-6">
                <div className="flex items-center justify-between mb-6">
                  <Logo size="small" />
                  <button onClick={restart} aria-label="Start over with a new household" className="text-sm font-medium hover:opacity-70 transition-colors flex items-center gap-1" style={{color: '#0091AD'}}>
                    {"\u21BB"} Start over
                  </button>
                </div>
              </div>
            )}
            {screen === "round" && household && (
              <div className="max-w-5xl mx-auto px-4 mb-4">
                <ProgressBar current={currentRound} total={rounds.length} />
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <QualityOfLifeMeter score={qualityScore} />
                  <BudgetBar income={household.monthlyIncome} expenses={expenseTotal} benefits={benefitTotal} />
                </div>
              </div>
            )}
            {screen === "intro" && <IntroScreen onStart={() => setScreen("select")} />}
            {screen === "select" && (
              <div className="v2-section v2-section-cream">
                <div className="v2-section-inner-wide">
                  <HouseholdSelect onSelect={selectHousehold} showBuilder={hasCompletedSim} />
                </div>
              </div>
            )}
            {screen === "regionSelect" && household && (
              <div className="v2-section v2-section-white">
                <div className="v2-section-inner">
                  <RegionSelect household={household} onSelect={selectRegion} caState={caState} onCaToggle={setCaState} medicalEnrolledPreFreeze={medicalEnrolledPreFreeze} onMedicalEnrollment={setMedicalEnrolledPreFreeze} calworksApplied={calworksApplied} onCalworksApplied={setCalworksApplied} />
                </div>
              </div>
            )}
            {screen === "householdIntro" && household && (
              <div className="v2-section v2-section-cream">
                <div className="v2-section-inner-wide">
                  <HouseholdIntro household={household} adjustedExpenses={adjustedExpenses} region={region} onContinue={() => setScreen("round")} />
                </div>
              </div>
            )}
            {screen === "round" && household && currentRound < rounds.length && (
              <div className={`v2-section ${currentRound % 2 === 0 ? 'v2-section-cream' : 'v2-section-white'}`}>
                <div className="v2-section-inner v2-round-enter" key={currentRound}>
                  <PolicyRound key={currentRound} round={rounds[currentRound]} household={household} currentBenefits={currentBenefits} onChoice={handleRoundChoice} onContinue={advanceRound} onGoBack={currentRound > 0 ? goBackRound : null} />
                </div>
              </div>
            )}
            {screen === "results" && household && (
              <ResultsScreen household={household} region={region} finalBenefits={currentBenefits} finalScore={qualityScore} allChoices={allChoices} skippedRounds={skippedRounds} rounds={rounds} qolHistory={qolHistory} onRestart={restart} />
            )}
          </main>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
