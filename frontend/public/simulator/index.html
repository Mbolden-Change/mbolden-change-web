  <style>
    :root {
      --brand-black: #000000;
      --brand-white: #FFFFFF;
      --brand-yellow: #FAD826;
      --brand-teal: #0091AD;
      --brand-fuchsia: #B22F93;
      --brand-gray: #E2E2E2;
      --brand-cream: #F8EFE0;
      --card-border: #d4cabb;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --muted: #777777;
    }
    html { font-size: 18px; scroll-behavior: smooth; }
    body { font-family: 'Roboto', Arial, sans-serif; line-height: 1.5; background: var(--brand-cream); color: var(--text); }
    h1, h2, h3, .brand-heading { font-family: 'Archivo Narrow', 'Arial Narrow', Arial, sans-serif; font-weight: 700; }
    .pre-header { font-family: 'Archivo Narrow', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .brand-quote { font-family: 'Archivo Narrow', 'Arial Narrow', Arial, sans-serif; font-weight: 700; }
    .angled-top { clip-path: polygon(0 8%, 100% 0, 100% 100%, 0 100%); }
    .angled-bottom { clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%); }
    .severity-1 { background-color: #FEF9C3; border-color: #FACC15; }
    .severity-2 { background-color: #FFEDD5; border-color: #FB923C; }
    .severity-3 { background-color: #FEE2E2; border-color: #EF4444; }
    .sev-tooltip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #1F2937; color: white; padding: 6px 10px; border-radius: 8px; font-size: 11px; white-space: nowrap; z-index: 50; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
    .sev-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #1F2937; }
    .abbr-tooltip { cursor: help; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }

    /* ── V2: Full-bleed hero ── */
    .v2-hero {
      min-height: 100vh; background: var(--brand-black);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 60px 40px; position: relative;
    }
    .v2-hero-logo { position: absolute; top: 28px; left: 40px; }
    .v2-hero-logo img { height: 72px; filter: invert(1) brightness(2); }
    .v2-hero-title {
      font-family: 'Archivo Narrow', sans-serif;
      font-size: clamp(42px, 7vw, 80px);
      font-weight: 700; line-height: 0.94;
      letter-spacing: -0.02em; text-transform: uppercase;
      color: var(--brand-white); margin-bottom: 20px;
      opacity: 0; animation: v2FadeUp 1s ease 0.4s forwards;
    }
    .v2-hero-title em { font-style: italic; color: var(--brand-yellow); }
    .v2-hero-sub {
      font-size: clamp(14px, 2vw, 18px); color: #999;
      max-width: 560px; margin: 0 auto 32px;
      opacity: 0; animation: v2FadeUp 1s ease 0.7s forwards;
    }
    .v2-hero-cta {
      display: inline-block; padding: 14px 36px; border-radius: 8px;
      font-family: 'Archivo Narrow', sans-serif; font-weight: 700;
      font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase;
      background: var(--brand-teal); color: white; border: none; cursor: pointer;
      opacity: 0; animation: v2FadeUp 1s ease 1s forwards;
      transition: opacity 0.2s;
    }
    .v2-hero-cta:hover { opacity: 0.9; }
    .v2-hero-scroll {
      position: absolute; bottom: 36px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      opacity: 0; animation: v2FadeUp 1s ease 1.2s forwards;
    }
    .v2-hero-scroll span {
      font-family: 'Archivo Narrow', sans-serif;
      font-size: 10px; letter-spacing: 0.25em;
      text-transform: uppercase; color: #666; margin-bottom: 8px;
    }
    .v2-hero-scroll .arrow {
      width: 18px; height: 18px;
      border-right: 2px solid #666; border-bottom: 2px solid #666;
      transform: rotate(45deg); animation: v2Bounce 2s ease infinite;
    }
    @keyframes v2FadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes v2Bounce {
      0%, 100% { transform: rotate(45deg) translateY(0); opacity: 1; }
      50% { transform: rotate(45deg) translateY(6px); opacity: 0.4; }
    }

    /* ── V2: Section bands ── */
    .v2-section { width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; padding: 48px 24px; }
    .v2-section-cream { background: var(--brand-cream); }
    .v2-section-white { background: var(--card-bg); }
    .v2-section-inner { max-width: 768px; margin: 0 auto; }
    .v2-section-inner-wide { max-width: 1024px; margin: 0 auto; }

    /* ── V2: Sticky stability bar ── */
    .v2-sticky-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(0,0,0,0.94);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(250,216,38,0.15);
      display: flex; align-items: center; justify-content: space-between;
      height: 40px; padding: 0 20px;
      transform: translateY(-100%); transition: transform 0.4s ease;
    }
    .v2-sticky-bar.visible { transform: translateY(0); }
    .v2-sticky-bar-label {
      font-family: 'Archivo Narrow', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--brand-yellow);
      white-space: nowrap; flex-shrink: 0;
    }
    .v2-sticky-bar-track {
      flex: 1; height: 6px; background: rgba(255,255,255,0.1);
      border-radius: 3px; margin: 0 16px; overflow: hidden;
    }
    .v2-sticky-bar-fill {
      height: 100%; border-radius: 3px;
      transition: width 1s ease-out, background-color 0.6s ease;
    }
    .v2-sticky-bar-score {
      font-family: 'Archivo Narrow', sans-serif;
      font-size: 13px; font-weight: 700; white-space: nowrap;
      transition: color 0.6s ease;
    }

    /* ── V2: Reveal animations ── */
    .v2-reveal {
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .v2-reveal.visible { opacity: 1; transform: translateY(0); }
    .v2-reveal-delay-1 { transition-delay: 0.15s; }
    .v2-reveal-delay-2 { transition-delay: 0.3s; }
    .v2-reveal-delay-3 { transition-delay: 0.45s; }

    /* ── V2: Round transition ── */
    .v2-round-enter { animation: v2RoundIn 0.5s ease forwards; }
    @keyframes v2RoundIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── V2: Tradeoff cards ── */
    .v2-tradeoff-card {
      width: 100%; text-align: left; padding: 16px 20px;
      border-radius: 10px; border: 2px solid var(--card-border);
      background: var(--card-bg); transition: all 0.2s ease;
      cursor: pointer; position: relative;
    }
    .v2-tradeoff-card:hover { border-color: #999; }
    .v2-tradeoff-card.selected { border-color: transparent; }
    .v2-tradeoff-card.sev-1.selected { border-left: 5px solid #FACC15; background: #FFFDF0; border-color: #FACC15; }
    .v2-tradeoff-card.sev-2.selected { border-left: 5px solid #FB923C; background: #FFF8F1; border-color: #FB923C; }
    .v2-tradeoff-card.sev-3.selected { border-left: 5px solid #EF4444; background: #FEF5F5; border-color: #EF4444; }
    .v2-tradeoff-detail {
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .v2-tradeoff-detail.open { max-height: 120px; opacity: 1; }

    /* ── V2: Receipt-style summary ── */
    .v2-receipt {
      background: #faf6ee;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.008) 2px, rgba(0,0,0,0.008) 3px),
        repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.005) 4px, rgba(0,0,0,0.005) 5px);
      border-radius: 0; position: relative; padding: 32px 28px;
      box-shadow: 2px 4px 20px rgba(0,0,0,0.10), inset 0 0 40px rgba(180,160,120,0.06);
    }
    .v2-receipt::before {
      content: ''; position: absolute; top: -8px; left: 0; right: 0; height: 8px;
      background: linear-gradient(135deg, #faf6ee 33.33%, transparent 33.33%) 0 0 / 12px 8px,
                  linear-gradient(225deg, #faf6ee 33.33%, transparent 33.33%) 12px 0 / 12px 8px;
      background-repeat: repeat-x;
    }
    .v2-receipt::after {
      content: ''; position: absolute; bottom: -8px; left: 0; right: 0; height: 8px;
      background: linear-gradient(315deg, #faf6ee 33.33%, transparent 33.33%) 0 0 / 12px 8px,
                  linear-gradient(45deg, #faf6ee 33.33%, transparent 33.33%) 12px 0 / 12px 8px;
      background-repeat: repeat-x;
    }
    .v2-receipt-line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #d4cabb; font-size: 14px; }
    .v2-receipt-line:last-child { border-bottom: none; }
    .v2-receipt-total { display: flex; justify-content: space-between; padding: 10px 0; border-top: 2px solid #000; font-weight: 700; font-size: 16px; margin-top: 8px; }

    /* ── V2: Card styling ── */
    .v2-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 20px; transition: border-color 0.2s;
    }
    .v2-card:hover { border-color: #999; }

    /* ── V2: Mobile ── */
    @media (max-width: 640px) {
      html { font-size: 16px; }
      .v2-hero { padding: 40px 20px; }
      .v2-hero-logo { top: 16px; left: 20px; }
      .v2-hero-logo img { height: 48px; }
      .v2-section { padding: 32px 16px; }
      .v2-sticky-bar { height: 36px; padding: 0 12px; }
      .v2-sticky-bar-label { font-size: 9px; }
      .v2-sticky-bar-score { font-size: 11px; }
      .v2-receipt { padding: 24px 16px; }
      .max-w-3xl { padding-left: 1rem; padding-right: 1rem; }
      .qol-chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .qol-chart-wrap svg { min-width: 480px; }
    }
    @media (max-width: 375px) {
      .v2-hero-title { font-size: 36px; }
      .v2-sticky-bar-track { margin: 0 8px; }
    }

    /* ── Print ── */
    @media print {
      .v2-sticky-bar { display: none !important; }
      .v2-reveal { opacity: 1 !important; transform: none !important; }
      .v2-round-enter { animation: none !important; }
    }

    // ─── Eligibility Engine ────────────────────────────────────────────────────

    function calculateFPL(members) {
      // 2026 HHS poverty guidelines (ASPE; FR Doc. 2026-00755, Jan 15, 2026)
      if (members <= 0) return 0;
      return EngineAdapter.fplAnnual(members);
    }

    function calculateEligibility(income, adults, children, childrenAges, mixedStatus, adultsOver65, options) {
      const opts = options || {};
      const incomeSource = opts.incomeSource || "employment";
      const childcareCost = opts.childcareCost || 0;
      const housingCost = opts.housingCost || 0;
      const medicalCost = opts.medicalCost || 0;

      const members = adults + children;
      const annualIncome = income * 12;
      const baseFPL = calculateFPL(members);
      const schoolAgeChildren = (childrenAges || []).filter(a => a >= 5 && a <= 18).length;
      const underFiveChildren = (childrenAges || []).filter(a => a < 5).length;
      const isElderly = (adultsOver65 || 0) > 0;

      // CalFresh via the embedded verified engine — FFY2027 values (USDA FNA FY2027
      // COLA memo; CDSS ACIN I-40-26): allotments, $217–$308 standard deductions,
      // CA SUA $686, $769 shelter cap. CA MCE/BBCE 200% FPL gross screen (ACL 23-60);
      // elderly/disabled over 200% fall back to the net test (7 CFR 273.9(a)(2));
      // ineligible-member income proration per 7 CFR 273.11(c).
      const earnedIncomeForSnap = incomeSource === "retirement" ? 0 : incomeSource === "mixed" ? income * 0.5 : income;
      const cfRes = EngineAdapter.calfresh({
        adults, children, childrenAges, isElderly, mixedStatus,
        fullyUndocumented: opts.fullyUndocumented || false,
        earnedMonthly: earnedIncomeForSnap, unearnedMonthly: income - earnedIncomeForSnap,
        housingCost, childcareCost, medicalCost,
      });
      const snapEligible = cfRes.eligible;
      const snapMax = cfRes.maxAllotment;
      let snapBenefit = cfRes.amount;

      // Medicaid expansion: income ≤ 138% FPL
      const medicaidLimit = baseFPL * 1.38 / 12; // Monthly comparison
      const adultMedicaidEligible = !mixedStatus && income <= medicaidLimit;
      // Children's Medicaid: ≤ 138% FPL — US-citizen children qualify regardless of parent immigration status
      const childMedicaidEligible = children > 0 && income <= medicaidLimit;
      const medicaidAdultValue = adultMedicaidEligible ? adults * 450 : 0;
      const medicaidChildValue = childMedicaidEligible ? children * 300 : 0;
      const medicaidEligible = adultMedicaidEligible || childMedicaidEligible;
      const medicaidTotal = medicaidAdultValue + medicaidChildValue;

      // CHIP: children at 138–200% FPL — mutually exclusive with children's Medicaid
      const chipLimit = baseFPL * 2.0 / 12;
      const chipEligible = children > 0 && !childMedicaidEligible && income <= chipLimit;
      const chipBenefit = chipEligible ? children * 170 : 0;

      // TANF: income ≤ ~50% FPL (very restrictive)
      const tanfLimit = baseFPL * 0.5 / 12;
      const tanfEligible = !mixedStatus && income <= tanfLimit && children > 0;
      const tanfAllotments = { 2: 300, 3: 432, 4: 500, 5: 575, 6: 650, 7: 725, 8: 800 };
      const tanfBenefit = tanfEligible ? (tanfAllotments[Math.min(members, 8)] || 800) : 0;

      // Housing: income ≤ 50% AMI (proxy: ~$35,000/year for family of 4)
      const housingIncomeLimit = (35000 * (members / 4)) / 12;
      const housingEligible = !mixedStatus && income <= housingIncomeLimit;
      const housingAllotments = { 1: 410, 2: 410, 3: 620, 4: 750, 5: 750, 6: 850, 7: 950, 8: 1050 };
      const housingBenefit = housingEligible ? (housingAllotments[Math.min(members, 8)] || 1050) : 0;

      // WIC: income ≤ 185% FPL, requires child under 5
      const wicLimit = baseFPL * 1.85 / 12;
      const wicEligible = income <= wicLimit && underFiveChildren > 0;
      const wicBenefit = wicEligible ? 75 : 0;

      // School Lunch (free): income ≤ 130% FPL, requires school-age children
      const schoolLunchLimit = baseFPL * 1.3 / 12;
      const schoolLunchEligible = income <= schoolLunchLimit && schoolAgeChildren > 0;
      const schoolLunchBenefit = schoolLunchEligible ? schoolAgeChildren * 65 : 0;

      // LIHEAP: income ≤ 150% FPL
      const liheapLimit = baseFPL * 1.5 / 12;
      const liheapEligible = income <= liheapLimit;
      const liheapBenefit = liheapEligible ? 85 : 0;

      // Medicare: for adults 65+ (monthly value estimate)
      const medicareEligible = isElderly;
      const medicareBenefit = medicareEligible ? (adultsOver65 || 0) * 820 : 0;

      // Meals on Wheels (mealProgram): for elderly, income-eligible
      const mealProgramEligible = isElderly && income <= (baseFPL * 1.5 / 12);
      const mealProgramBenefit = mealProgramEligible ? 120 : 0;

      // EITC: requires earned income, phases out — ALL ANNUAL values (2025 per Rev. Proc. 2024-40)
      const eitcLimits = { 0: 19104, 1: 50434, 2: 57310, 3: 61555 };
      const mfjAdjs = { 0: 7110, 1: 7120, 2: 7120, 3: 7120 };
      const mfjAdj = adults > 1 ? (mfjAdjs[Math.min(children, 3)] || 7120) : 0;
      const eitcLimit = (eitcLimits[Math.min(children, 3)] || 61555) + mfjAdj;
      const eitcMaxes = { 0: 649, 1: 4328, 2: 7152, 3: 8046 };
      const eitcMaxForFamily = eitcMaxes[Math.min(children, 3)] || 8046;
      // EITC requires EARNED income (26 USC 32(c)(2)): none for retirement income,
      // half for mixed retirement/wage households (matching the SNAP/CalWORKs split).
      // Phase-out still runs on total income (greater-of-AGI rule). [Audit v6 M3]
      const eitcEarnedAnnual = incomeSource === "retirement" ? 0 : incomeSource === "mixed" ? annualIncome * 0.5 : annualIncome;
      const eitcEligible = !mixedStatus && eitcEarnedAnnual > 0 && annualIncome <= eitcLimit;

      // EITC phase-in / plateau / phaseout calculation (2025 per Rev. Proc. 2024-40)
      let eitcBenefit = 0;
      if (eitcEligible) {
        const eitcPhaseInRate = { 0: 0.0765, 1: 0.34, 2: 0.40, 3: 0.45 };
        const eitcEarnedIncomeAmt = { 0: 8490, 1: 12730, 2: 17880, 3: 17880 };
        const eitcPhaseoutStart = { 0: 10620, 1: 23350, 2: 23350, 3: 23350 };
        const eitcPhaseoutRate = { 0: 0.0765, 1: 0.1598, 2: 0.2106, 3: 0.2106 };
        const childKey = Math.min(children, 3);
        const piRate = eitcPhaseInRate[childKey] || 0.45;
        const earnedAmt = eitcEarnedIncomeAmt[childKey] || 17880;
        const startPt = (eitcPhaseoutStart[childKey] || 23350) + mfjAdj;
        const rate = eitcPhaseoutRate[childKey] || 0.2106;
        // Phase-in: credit ramps up from $0 to max as income rises to earned income amount
        const phaseInCredit = Math.min(eitcMaxForFamily, Math.round(eitcEarnedAnnual * piRate));
        if (annualIncome <= startPt) {
          eitcBenefit = phaseInCredit;
        } else {
          // Credit is the LESSER of the phase-in amount and the phase-out amount —
          // matters when earned income < AGI (mixed retirement/wage households).
          eitcBenefit = Math.max(0, Math.min(phaseInCredit, Math.round(eitcMaxForFamily - (annualIncome - startPt) * rate)));
        }
      }

      // CTC: $2,200/child — ALL ANNUAL values
      // Phaseout: $50 reduction per $1,000 over $400,000 (MFJ) or $200,000 (single)
      const ctcPhaseoutThreshold = adults > 1 ? 400000 : 200000;
      const ctcFullCredit = children * 2200;
      const ctcAfterPhaseout = Math.max(0, ctcFullCredit - Math.max(0, Math.ceil((annualIncome - ctcPhaseoutThreshold) / 1000) * 50));
      // CTC via the embedded verified engine: nonrefundable portion (against computed
      // federal liability, TY2025 standard deduction and brackets) + refundable ACTC
      // (15% of earnings over $2,500, capped $1,700/child). Fixes the v2 seam where
      // only the refundable portion was stored, understating CTC for families with
      // tax liability. SSN rules per OBBBA (ITIN filers excluded).
      const ctcRes = EngineAdapter.ctc({ annualIncome, earnedAnnual: eitcEarnedAnnual, adults, children, mixedStatus });
      const ctcEligible = ctcRes.eligible && children > 0;
      const ctcAnnual = ctcRes.total;

      const result = {
        snap: { eligible: snapEligible, default: Math.round(snapBenefit), min: 0, max: snapMax, note: snapEligible ? "" : "Income exceeds SNAP limits for your household size" },
        medicaid: { eligible: medicaidEligible, default: medicaidEligible ? medicaidTotal : 0, min: 0, max: (adults + children) * 600, note: !medicaidEligible && mixedStatus ? "Mixed-status parents are ineligible for Medicaid" : !medicaidEligible ? "Income exceeds 138% FPL" : medicaidEligible && mixedStatus ? "US-citizen children qualify; parents are ineligible" : "" },
        chip: { eligible: chipEligible, default: Math.round(chipBenefit), min: 0, max: children * 340, note: chipEligible ? "" : children === 0 ? "No children in household" : childMedicaidEligible ? "Children covered through Medicaid" : "Income exceeds 200% FPL" },
        tanf: { eligible: tanfEligible, default: Math.round(tanfBenefit), min: 0, max: Math.round(tanfBenefit * 1.5), note: tanfEligible ? "" : mixedStatus ? "Mixed-status families are ineligible" : children === 0 ? "Requires children" : "Income exceeds ~50% FPL" },
        housing: { eligible: housingEligible, default: Math.round(housingBenefit), min: 0, max: Math.round(housingBenefit * 1.5), note: !housingEligible && mixedStatus ? "Mixed-status families are ineligible" : !housingEligible ? "Income exceeds 50% area median income" : "" },
        wic: { eligible: wicEligible, default: Math.round(wicBenefit), min: 0, max: 120, note: wicEligible ? "" : underFiveChildren === 0 ? "Requires child under 5" : "Income exceeds 185% FPL" },
        schoolLunch: { eligible: schoolLunchEligible, default: Math.round(schoolLunchBenefit), min: 0, max: schoolAgeChildren * 130, note: schoolLunchEligible ? "" : schoolAgeChildren === 0 ? "No school-age children (5–18)" : "Income exceeds 130% FPL" },
        liheap: { eligible: liheapEligible, default: Math.round(liheapBenefit), min: 0, max: 120, note: liheapEligible ? "" : "Income exceeds 150% FPL" },
      };

      // Add elderly-specific benefits only if relevant
      if (isElderly) {
        result.medicare = { eligible: medicareEligible, default: medicareBenefit, min: 0, max: (adultsOver65 || 0) * 1200, note: "" };
        result.mealProgram = { eligible: mealProgramEligible, default: mealProgramBenefit, min: 0, max: 180, note: mealProgramEligible ? "" : "Income exceeds 150% FPL" };
      }

      // Tax credits — stored as ANNUAL values
      result.eitc = { eligible: eitcEligible, default: eitcBenefit, min: 0, max: eitcMaxForFamily, note: eitcEligible ? "" : mixedStatus ? "ITIN filers are ineligible for EITC" : children === 0 ? "Childless EITC is very small; requires very low income" : annualIncome > eitcLimit ? "Annual income exceeds EITC limit (" + formatMoney(eitcLimit) + ")" : "Not eligible", isAnnual: true };
      result.ctc = { eligible: ctcEligible, default: ctcAnnual, min: 0, max: children * 1700, note: ctcEligible ? "" : mixedStatus ? "ITIN filers are ineligible under OBBB" : children === 0 ? "Requires children" : ctcAfterPhaseout <= 0 ? "Income exceeds CTC phaseout threshold (" + formatMoney(ctcPhaseoutThreshold) + ")" : "Requires children and SSN", isAnnual: true };

      // Fully undocumented override: zero out all programs that require qualified immigration status
      // Only WIC and school lunch don't verify status at the federal level
      const isFullyUndocumented = opts.fullyUndocumented || false;
      if (isFullyUndocumented) {
        const undocNote = "Requires qualified immigration status";
        if (result.snap) { result.snap.eligible = false; result.snap.default = 0; result.snap.note = undocNote; }
        if (result.medicaid) { result.medicaid.eligible = false; result.medicaid.default = 0; result.medicaid.note = "Undocumented residents are ineligible for federal Medicaid"; }
        if (result.childMedicaid) { result.childMedicaid.eligible = false; result.childMedicaid.default = 0; result.childMedicaid.note = "Undocumented children are ineligible for federal Medicaid (Medi-Cal covers them in CA)"; }
        if (result.chip) { result.chip.eligible = false; result.chip.default = 0; result.chip.note = undocNote; }
        if (result.tanf) { result.tanf.eligible = false; result.tanf.default = 0; result.tanf.note = undocNote; }
        if (result.housing) { result.housing.eligible = false; result.housing.default = 0; result.housing.note = undocNote; }
        if (result.liheap) { result.liheap.eligible = false; result.liheap.default = 0; result.liheap.note = undocNote; }
        if (result.eitc) { result.eitc.eligible = false; result.eitc.default = 0; result.eitc.note = "Requires SSN for filer"; }
        if (result.ctc) { result.ctc.eligible = false; result.ctc.default = 0; result.ctc.note = "Requires SSN for child and filer"; }
        if (result.medicare) { result.medicare.eligible = false; result.medicare.default = 0; result.medicare.note = undocNote; }
        if (result.mealProgram) { result.mealProgram.eligible = false; result.mealProgram.default = 0; result.mealProgram.note = undocNote; }
        // WIC and schoolLunch remain — they don't verify immigration status
      }

      return result;
    }

    function calculateCAEligibility(income, adults, children, childrenAges, mixedStatus, adultsOver65, options, federalResult) {
      const opts = options || {};
      const fullyUndocumented = opts.fullyUndocumented || false;
      const members = adults + children;
      const annualIncome = income * 12;
      const baseFPL = calculateFPL(members);
      const underFiveChildren = (childrenAges || []).filter(a => a < 5).length;
      const isElderly = (adultsOver65 || 0) > 0;
      const calworksRegion = opts.calworksRegion || 1;

      const result = {};

      // CalWORKs: CA's TANF — higher grants, broader eligibility
      // Eligibility: families with children, income below MBSAC (~75-80% FPL for CA, more generous than federal 50%)
      // CA does not exclude based on immigration status for children; parents need legal status or meet exemptions
      // CalWORKs via the embedded verified engine — MAP per ACL 26-66 (Oct 1, 2026,
      // +1.8% per AB 152; the previously assumed July 2025 +5% increase never
      // occurred). Grant = MAP − Net Nonexempt Income with
      // the $600 + 50% earned income disregard (ACL 21-130) — benefits taper to exit
      // around 2×MAP+$600 instead of a hard stop at 75% FPL. Mixed-status families:
      // citizen children form a child-only AU with parental income deemed after
      // disregards and an MBSAC-differential allocation (MPP 44-133.2, approximation).
      const cwEarned = (opts.incomeSource || "employment") === "retirement" ? 0 : (opts.incomeSource === "mixed" ? income * 0.5 : income);
      const cwRes = EngineAdapter.calworks({
        adults, children, childrenAges, isElderly, mixedStatus, fullyUndocumented,
        earnedMonthly: cwEarned, unearnedMonthly: income - cwEarned,
        region: calworksRegion === 2 ? 'r2' : 'r1',
      });
      const calworksEligible = cwRes.eligible;
      const calworksAmount = cwRes.grant;
      const federalTanf = (federalResult && federalResult.tanf) ? federalResult.tanf.default : 0;
      const calworksAddon = calworksEligible ? Math.max(0, calworksAmount - federalTanf) : 0;
      result.calworks = {
        eligible: calworksEligible,
        default: calworksAddon,
        fullAmount: calworksAmount,
        replacesProgram: "tanf",
        note: calworksEligible ? (mixedStatus ? "Child-only CalWORKs grant of " + formatMoney(calworksAmount) + "/mo \u2014 the US-citizen children qualify; part of the parents' income counts against the grant (estimated; county practices vary)" : "CalWORKs provides " + formatMoney(calworksAmount) + "/mo (grant = MAP \u2212 countable income; replaces federal TANF)") : children === 0 ? "Requires children" : "Earnings exceed CalWORKs exit point (grant tapers to $0)",
        isAnnual: false,
      };

      // Medi-Cal full-scope expansion: as of Jan 2024, ALL income-eligible Californians qualify
      // regardless of immigration status. This is HUGE for mixed-status families.
      // Income limit: 138% FPL for adults, 266% FPL for children
      // NOTE: Starting Jan 2026, new enrollment freeze for undocumented adults (but existing enrollees keep coverage)
      const medicalAdultLimit = baseFPL * 1.38 / 12;
      const medicalChildLimit = baseFPL * 2.66 / 12;
      // In CA, even undocumented adults can get Medi-Cal (unlike federal Medicaid)
      const medicalAdultEligible = income <= medicalAdultLimit; // No immigration status check!
      const medicalChildEligible = children > 0 && income <= medicalChildLimit;
      const medicalEligible = medicalAdultEligible || medicalChildEligible;
      // Calculate the ADDITIONAL coverage CA provides beyond federal Medicaid
      const federalMedicaidValue = (federalResult && federalResult.medicaid) ? federalResult.medicaid.default : 0;
      const fullMedicalValue = (medicalAdultEligible ? adults * 450 : 0) + (medicalChildEligible ? children * 300 : 0);
      const medicalAddon = Math.max(0, fullMedicalValue - federalMedicaidValue);
      // For fully undocumented families, Medi-Cal IS their only health coverage (no federal Medicaid at all)
      // For mixed-status, it's the addon for parents excluded from federal Medicaid
      // For documented families, federal Medicaid already covers them
      const medicalIsOnlyCoverage = fullyUndocumented;
      const medicalDisplayValue = medicalIsOnlyCoverage ? fullMedicalValue : medicalAddon;
      result.medicalExpansion = {
        eligible: medicalDisplayValue > 0 && (mixedStatus || fullyUndocumented),
        default: medicalDisplayValue,
        note: fullyUndocumented
          ? "Medi-Cal is this family's ONLY health coverage. California expanded full-scope Medi-Cal to all income-eligible adults regardless of immigration status in January 2024. New enrollment for undocumented adults (19+) was frozen January 2026. Children under 19 can still enroll."
          : mixedStatus
            ? "Medi-Cal covers ALL income-eligible residents regardless of immigration status — parents who are excluded from federal Medicaid can get full coverage in California"
            : "Federal Medicaid already covers this household; Medi-Cal provides equivalent coverage",
        isAnnual: false,
      };

      // CalEITC + YCTC: state tax credits that stack on federal EITC
      // CRITICAL: ITIN filers ARE eligible — this is the key differentiator for mixed-status families
      // CalEITC + YCTC via the embedded verified engine: exact FTB 2025 3514 lookup
      // table (658 rows, $50 bands) — replaces the previous flat-max-to-$27,425 model,
      // which was the YCTC's architecture, not CalEITC's. YCTC now phases out at
      // $21.71 per $100 of earned income over $27,425 (FTB 3514 Lines 25–27).
      // CalEITC/YCTC require CA EARNED income (FTB): none for retirement, half for
      // mixed income. AGI lookup still uses total income. [Audit v6 M3]
      const caEarnedAnnual = (opts.incomeSource || "employment") === "retirement" ? 0 : opts.incomeSource === "mixed" ? annualIncome * 0.5 : annualIncome;
      const calCredits = EngineAdapter.caleitcYctc({ annualEarned: caEarnedAnnual, agi: annualIncome, children, childrenAges });
      const caleitcEligible = annualIncome > 0 && annualIncome <= 32900;
      const caleitcAmount = calCredits.caleitc;
      const underSixChildren = (childrenAges || []).filter(a => a < 6).length;
      const yctcEligible = calCredits.yctc > 0;
      const yctcAmount = calCredits.yctc;
      const totalCalCredits = caleitcAmount + yctcAmount;
      result.caleitc = {
        eligible: caleitcEligible && totalCalCredits > 0,
        default: totalCalCredits,
        caleitcPortion: caleitcAmount,
        yctcPortion: yctcAmount,
        note: caleitcEligible ? (mixedStatus ? "ITIN filers ARE eligible for CalEITC and YCTC — unlike federal EITC" : "California tax credits that stack on top of federal EITC") : annualIncome > 32900 ? "Annual income exceeds $32,900 CalEITC limit" : "Requires earned income",
        isAnnual: true,
      };

      // CFAP: state-funded food assistance for qualified immigrants ineligible for federal SNAP
      // Covers: LPRs < 5 years, parolees, conditional entrants, trafficking victims, U-visa holders
      // Does NOT cover undocumented immigrants (except age 55+ starting Oct 2027)
      // Benefits equal CalFresh/SNAP amounts
      // For mixed-status: the undocumented parents do NOT qualify for CFAP
      // But lawfully present immigrants who are excluded from SNAP can get CFAP
      const cfapEligible = false; // Simplified: most mixed-status families with undocumented parents don't qualify
      // In a more nuanced model, we'd check specific immigration subcategories
      result.cfap = {
        eligible: cfapEligible,
        default: 0,
        note: "CFAP covers lawfully present immigrants ineligible for federal SNAP (e.g., LPRs under 5 years). It does not cover undocumented immigrants except those 55+ (starting Oct 2027).",
        isAnnual: false,
      };

      // CAPI: state SSI equivalent for aged/blind/disabled non-citizens ineligible for SSI due to immigration status
      const capiEligible = isElderly && mixedStatus && income <= (baseFPL * 0.75 / 12);
      const capiAmount = capiEligible ? (adults > 1 && (adultsOver65 || 0) > 1 ? CAPI_COUPLE : CAPI_INDIVIDUAL) : 0;
      result.capi = {
        eligible: capiEligible,
        default: capiAmount,
        note: capiEligible ? "State-funded cash aid for aged/disabled non-citizens ineligible for federal SSI" : !isElderly ? "Requires adults 65+ or disabled" : !mixedStatus ? "For non-citizens ineligible for federal SSI" : "Income too high",
        isAnnual: false,
      };

      // CARE/FERA: utility rate discounts
      // CARE: 32.5% off electric for income ≤ limits; FERA: 18% for slightly higher
      const careLimit = CARE_INCOME_LIMITS[Math.min(members, 8)] || 108300;
      const careEligible = annualIncome <= careLimit;
      // Estimate monthly savings: average CA electric bill ~$150-200, so 32.5% = ~$50-65
      const careSavings = careEligible ? 55 : 0; // Conservative estimate of monthly savings
      result.careDiscount = {
        eligible: careEligible,
        default: careSavings,
        note: careEligible ? "32.5% discount on electricity bills through CARE program" : "Household income exceeds CARE limits",
        isAnnual: false,
      };

      // CA childcare subsidies: beyond federal CCDF
      // Families up to 85% SMI (~$70K for family of 4); fees eliminated below 75% SMI
      // Estimate additional subsidy value
      const hasYoungChildren = underFiveChildren > 0 || (childrenAges || []).some(a => a < 13);
      // CA childcare subsidies require qualified immigration status for parents
      const caChildcareEligible = hasYoungChildren && annualIncome <= 70000 && !fullyUndocumented; // Approximate 85% SMI for family of 4
      const caChildcareSavings = caChildcareEligible ? (underFiveChildren > 0 ? 350 : 200) : 0;
      result.caChildcare = {
        eligible: caChildcareEligible && caChildcareSavings > 0,
        default: caChildcareSavings,
        note: fullyUndocumented ? "CA childcare subsidies require qualified immigration status for parents" : caChildcareEligible ? "CA subsidized childcare — families below 75% state median income pay no fees" : "Income exceeds CA childcare subsidy threshold",
        isAnnual: false,
      };

      return result;
    }

    function applyCALayer(household, region, opts) {
      // Enrollment status: "all" = whole family, "children-only" = kids but not parents, "none" = nobody
      // null means unanswered — default to "all" (assume enrolled for presets that don't ask)
      const medicalEnrollment = (opts && opts.medicalEnrolledPreFreeze != null)
        ? opts.medicalEnrolledPreFreeze
        : "all";
      // CalWORKs take-up: mixed-status families default to NOT applied (documented
      // low take-up — chilling effect, verification burden, county inconsistency).
      // All other households default to enrolled (prior behavior).
      const calworksApplied = (opts && opts.calworksApplied != null)
        ? opts.calworksApplied
        : !household.mixedStatus;
      // Determine household composition from preset data
      const hhComposition = {
        "single-mom": { adults: 1, children: 2, childrenAges: [4, 9], adultsOver65: 0 },
        "elderly-couple": { adults: 2, children: 0, childrenAges: [], adultsOver65: 2 },
        "working-family": { adults: 2, children: 3, childrenAges: [2, 7, 12], adultsOver65: 0 },
        "mixed-status": { adults: 2, children: 3, childrenAges: [3, 8, 13], adultsOver65: 0 },
        "undocumented": { adults: 2, children: 2, childrenAges: [4, 10], adultsOver65: 0 },
        "middle-class": { adults: 2, children: 2, childrenAges: [10, 7], adultsOver65: 0 },
      };

      const comp = household.isCustom
        ? { adults: household.adults, children: household.children, childrenAges: (household.childrenAges || []).map(a => a === "under5" ? 3 : a === "5-12" ? 9 : 15), adultsOver65: household.adultsOver65 || 0 }
        : (hhComposition[household.id] || { adults: 1, children: 0, childrenAges: [], adultsOver65: 0 });

      const calworksRegion = (region && region.calworksRegion) || 1;
      const incomeMult = (region && region.incomeMult) || 1.0;

      // Adjust income for CA wage levels (preset households only — custom users set their own)
      // Undocumented and mixed-status workers get a PARTIAL income multiplier:
      // market forces (cost of living, competition for labor) push wages up even in cash-pay
      // arrangements, but wage theft, lack of labor protections, and exploitation mean they
      // capture only ~50% of the regional wage premium that documented workers receive.
      // This ensures ~900k Bay Area CalEITC-qualifying households are represented.
      const isUndocWorker = household.mixedStatus || household.fullyUndocumented;
      // Social Security does not vary by metro — no wage multiplier on retirement
      // income. [Audit v6 M2]
      const effectiveMult = household.isCustom ? 1.0
        : household.incomeSource === "retirement" ? 1.0
        : isUndocWorker ? (1.0 + (incomeMult - 1.0) * 0.5)  // 50% of premium
        : incomeMult;
      const adjustedIncome = Math.round(household.monthlyIncome * effectiveMult);

      // Build a minimal federal result object for the CA function
      const federalResult = {
        tanf: { default: household.benefits.tanf || 0 },
        // Include children's coverage so the Medi-Cal "expansion addon" is the value
        // of coverage the state adds BEYOND all federal Medicaid rows. [Audit v6 H1]
        medicaid: { default: (household.benefits.medicaid || 0) + (household.benefits.childMedicaid || 0) },
      };

      const caElig = calculateCAEligibility(
        adjustedIncome,
        comp.adults,
        comp.children,
        comp.childrenAges,
        household.mixedStatus,
        comp.adultsOver65,
        { calworksRegion, incomeSource: household.incomeSource || "employment", fullyUndocumented: household.fullyUndocumented || false },
        federalResult
      );

      // Build the enhanced household with CA-adjusted income
      const enhanced = { ...household, caState: true };
      if (!household.isCustom && effectiveMult !== 1.0) {
        enhanced.monthlyIncome = adjustedIncome;
        enhanced.originalIncome = household.monthlyIncome;
        enhanced.caIncomeMult = effectiveMult;
      }
      const caBenefits = {};
      const caAnnualCredits = {};

      // Gate Medi-Cal based on enrollment status
      // "all" = full family coverage, "children-only" = kids covered but not adults, "none" = nobody enrolled
      if (medicalEnrollment !== "all" && (household.mixedStatus || household.fullyUndocumented)) {
        if (caElig.medicalExpansion && caElig.medicalExpansion.eligible) {
          if (medicalEnrollment === "children-only" && comp.children > 0) {
            // Mixed-status: the citizen children's coverage is FEDERAL childMedicaid and
            // already sits in household.benefits — the CA addon is $0, not a duplicate
            // children x $300. Fully undocumented children have no federal row, so the
            // CA value stands. [Audit v6 H1]
            const childrenOnlyValue = household.fullyUndocumented ? comp.children * 300 : 0;
            caElig.medicalExpansion = { ...caElig.medicalExpansion, default: childrenOnlyValue, note: "Only the children are enrolled in Medi-Cal. The parents never applied — the enrollment freeze means they can no longer get full-scope coverage. They qualify for restricted-scope (emergency) Medi-Cal only." };
          } else {
            // "none" — nobody enrolled, or "children-only" with no children
            caElig.medicalExpansion = { ...caElig.medicalExpansion, eligible: false, default: 0, note: "No one in this family enrolled in Medi-Cal. The adults can no longer apply for full-scope coverage after the January 2026 freeze. They qualify for restricted-scope (emergency) Medi-Cal only — ER visits and emergency dental, initiated by hospital billing." };
          }
        }
      }

      Object.entries(caElig).forEach(([key, val]) => {
        if (val.eligible && val.default > 0) {
          if (val.isAnnual) {
            caAnnualCredits[key] = val.default;
          } else {
            caBenefits[key] = val.default;
          }
        }
      });

      // Merge monthly CA benefits into household benefits
      enhanced.benefits = { ...household.benefits, ...caBenefits };
      enhanced.caBenefits = caBenefits;

      // Merge annual credits
      enhanced.annualCredits = { ...household.annualCredits, ...caAnnualCredits };
      enhanced.caAnnualCredits = caAnnualCredits;

      // CalWORKs replaces TANF — but the grant is only COUNTED if the family has
      // actually applied. For mixed-status households the default is "never applied":
      // the child-only entitlement is real, take-up is not. Unclaimed grants surface
      // on the results screen as an unclaimed entitlement instead of income.
      if (caElig.calworks && caElig.calworks.eligible) {
        if (calworksApplied) {
          enhanced.benefits.tanf = caElig.calworks.fullAmount;
          delete enhanced.benefits.calworks; // don't double-count — CalWORKs IS the TANF payment in CA
          delete enhanced.caBenefits.calworks; // [Audit v6 H3] one display row, via calworksBoost below
          enhanced.caBenefits.calworksBoost = caElig.calworks.default;
        } else {
          delete enhanced.benefits.calworks;
          delete enhanced.caBenefits.calworks;
          enhanced.calworksUnclaimed = {
            amount: caElig.calworks.fullAmount,
            note: "This is an estimate — the exact amount depends on how the county counts the parents' income, and county practices vary",
          };
        }
      }

      // Store the CA eligibility details and enrollment status for the UI
      enhanced.caEligibility = caElig;
      enhanced.medicalEnrollment = medicalEnrollment;

      return enhanced;
    }


    // ─── Preset regeneration (engine-verified build) ─────────────────────
    // Preset benefit values were previously hardcoded and had drifted from any rule
    // set. They are now computed at load through the same engine-backed eligibility
    // path custom households use. 'housing' is intentionally NOT regenerated: the
    // app's 50%-AMI proxy is too crude for CA and would zero two presets; flagged
    // for the v4 TTP-based housing model. childMedicaid preset values are likewise
    // preserved (disability-waiver and mixed-status narratives).
    (function regeneratePresetsFromEngine() {
      const comp = {
        "single-mom": { adults: 1, children: 2, childrenAges: [4, 9], adultsOver65: 0, incomeSource: "employment" },
        "elderly-couple": { adults: 2, children: 0, childrenAges: [], adultsOver65: 2, incomeSource: "retirement" },
        "working-family": { adults: 2, children: 3, childrenAges: [2, 7, 12], adultsOver65: 0, incomeSource: "employment" },
        "mixed-status": { adults: 2, children: 3, childrenAges: [3, 8, 13], adultsOver65: 0, incomeSource: "employment" },
        "undocumented": { adults: 2, children: 2, childrenAges: [4, 10], adultsOver65: 0, incomeSource: "employment" },
        "middle-class": { adults: 2, children: 2, childrenAges: [10, 7], adultsOver65: 0, incomeSource: "employment" },
      };
      const SKIP = { housing: true, childMedicaid: true };
      HOUSEHOLDS.forEach(hh => {
        const c = comp[hh.id];
        if (!c) return;
        const e = hh.expenses || {};
        const res = calculateEligibility(hh.monthlyIncome, c.adults, c.children, c.childrenAges,
          !!hh.mixedStatus, c.adultsOver65, {
            incomeSource: c.incomeSource,
            childcareCost: e.childcare || 0,
            housingCost: e.housing || 0,
            medicalCost: (e.healthcare || 0) + (e.medications || 0),
            fullyUndocumented: !!hh.fullyUndocumented,
          });
        Object.keys(hh.benefits).forEach(k => {
          if (SKIP[k]) return;

        });

          if (res.ctc && "ctc" in hh.annualCredits) hh.annualCredits.ctc = res.ctc.default;
        }

      });
      // Ramirez baseline stability: recompute from engine-backed benefits via the

      if (typeof calculateBaselineQuality === "function") {
        const rz = HOUSEHOLDS.find(h => h.id === "mixed-status");

            rz.monthlyIncome, getCashBenefitTotal(rz.benefits), getExpenseTotal(rz.expenses),
            true, false, "employment", false));
        }
      }
    })();
    // __END_ENGINE_REGEN__

    function estimateExpenses(adults, children, hasChildcare, fullyUndocumented) {
      const childrenUnderFive = hasChildcare ? Math.min(children, 2) : 0; // Cap at 2 for childcare calculation
      // Fully undocumented families compress spending radically — shared rooms, no car,
      // no formal childcare, community-sourced clothing, Medi-Cal covers healthcare
      if (fullyUndocumented) {
        return {
          housing: Math.max(650, 750 + (adults + children - 3) * 100), // renting rooms, not apartments
          food: adults * 180 + children * 120, // cooking from scratch, employer meals, food banks
          healthcare: 0, // Medi-Cal covers everything
          transportation: 100 + Math.max(0, adults - 1) * 30, // buses, bikes — no car
          childcare: 0, // informal networks, no formal childcare access
          utilities: 0, // typically included in room rent
          clothing: adults * 10 + children * 10, // donations, hand-me-downs, thrift
          phone: 40, // prepaid, shared plans
          remittances: 150, // obligation to family abroad
          other: 40,
        };
      }
      return {
        housing: Math.max(750, 1150 + (adults + children - 3) * 200),
        food: adults * 250 + children * 180,
        healthcare: 45 + (adults + children) * 20,
        transportation: 280 + Math.max(0, adults - 1) * 50,
        childcare: childrenUnderFive * 400,
        utilities: 150 + (adults + children) * 20,
        clothing: adults * 40 + children * 35,
        phone: 55,
        other: 100,
      };
    }

    function calculateBaselineQuality(income, cashBenefits, expenses, mixedStatus, isElderly, incomeSource, fullyUndocumented) {
      const totalCash = income + cashBenefits;
      const expenseTotal = typeof expenses === 'number' ? expenses : getExpenseTotal(expenses);
      const ratio = expenseTotal > 0 ? totalCash / expenseTotal : 0;

      // Continuous scale with interpolation — score reflects real financial cushion
      let base;
      if (ratio >= 3.0) base = 95;
      else if (ratio >= 2.0) base = Math.round(85 + (ratio - 2.0) * 10);     // 85–95
      else if (ratio >= 1.5) base = Math.round(72 + (ratio - 1.5) * 26);     // 72–85
      else if (ratio >= 1.3) base = Math.round(63 + (ratio - 1.3) * 45);     // 63–72
      else if (ratio >= 1.15) base = Math.round(55 + (ratio - 1.15) * 53.3); // 55–63
      else if (ratio >= 1.0) base = Math.round(48 + (ratio - 1.0) * 46.7);   // 48–55
      else if (ratio >= 0.85) base = Math.round(38 + (ratio - 0.85) * 66.7); // 38–48
      else if (ratio >= 0.7) base = Math.round(30 + (ratio - 0.7) * 53.3);   // 30–38
      else base = Math.max(20, Math.round(20 + ratio * 14.3));                // 20–30

      if (mixedStatus) base = Math.max(20, base - (fullyUndocumented ? 12 : 8));
      // Full elderly penalty for fixed income, smaller for mixed, none for employment
      if (isElderly) {
        const elderlyPenalty = incomeSource === "retirement" ? 3 : incomeSource === "mixed" ? 1 : 0;
        base = Math.max(20, base - elderlyPenalty);
      }
      return Math.min(97, base);
    }

    function generateCustomStory(config) {
      const { name, adults, children, income, mixedStatus, fullyUndocumented, childrenAges, adultsOver65, incomeSource, hasDisabledChild } = config;
      const isElderly = (adultsOver65 || 0) > 0;
      const isFixedIncome = isElderly && incomeSource === "retirement";
      const isMixedIncome = isElderly && incomeSource === "mixed";
      const elderlySuffix = isElderly ? ` (${adultsOver65} age 65 or older)` : "";
      const isSingle = adults === 1;
      const isChildless = children === 0;

      // Build household description
      let story = "";
      if (isChildless) {
        if (isSingle) {
          story = `${name} is a single-adult household${elderlySuffix}. `;
        } else {
          story = `${name} is a household of ${adults} adults${elderlySuffix}. `;
        }
      } else {
        const childMsg = children === 1 ? "1 child" : `${children} children`;
        story = `${name} is a household of ${adults} adult${adults === 1 ? "" : "s"}${elderlySuffix} and ${childMsg}. `;
        const ages = (childrenAges || []).map(a => a === "under5" ? "under 5" : a === "5-12" ? "5-12" : "13-17");
        if (ages.length > 0) story += `The children are ages ${ages.join(", ")}. `;
        if (hasDisabledChild) story += `${children === 1 ? "The child has" : "At least one child has"} a disability and receives therapy and support services through Medicaid via a disability waiver. `;
      }

      // Add income/work context
      if (isFixedIncome) {
        if (isSingle) {
          story += `This individual is retired and lives on a fixed income of ${formatMoney(income)}/month from Social Security and/or pensions. `;
        } else {
          story += `They are retired and live on a combined fixed income of ${formatMoney(income)}/month from Social Security and/or pensions. `;
        }
      } else if (isMixedIncome) {
        if (isSingle) {
          story += `This individual has a mix of employment wages and retirement income totaling ${formatMoney(income)}/month. `;
        } else {
          story += `This household brings in ${formatMoney(income)}/month from a mix of employment wages and retirement income. `;
        }
      } else if (isElderly) {
        // Elderly but employment income
        if (isSingle) {
          story += `This individual earns ${formatMoney(income)}/month through employment. `;
        } else {
          story += `This household earns a combined ${formatMoney(income)}/month, with at least one working adult. `;
        }
      } else {
        if (isSingle && isChildless) {
          story += `This individual earns ${formatMoney(income)}/month. `;
          if (income < 3000) {
            story += `Every dollar is accounted for — rent, food, transportation, and healthcare leave almost nothing for emergencies. `;
          } else {
            story += `The budget is tight but manageable, with limited room for unexpected expenses. `;
          }
        } else if (isSingle) {
          story += `This single parent earns ${formatMoney(income)}/month while raising ${children === 1 ? "a child" : `${children} children`}. Every month is a balancing act. `;
        } else if (isChildless) {
          story += `They earn a combined ${formatMoney(income)}/month. `;
          if (income < 4000) {
            story += `With two adults on a tight budget, there is little margin for error. `;
          }
        } else {
          story += `They earn a combined ${formatMoney(income)}/month. Both are working and doing their best to provide for their family. `;
        }
      }

      // Build baseline note
      let baselineNote = "";
      if (isFixedIncome) {
        if (isChildless) {
          baselineNote = `This ${isSingle ? "individual lives" : "household lives"} on a fixed income. Social Security and benefits provide basic support, but rising healthcare costs and unexpected expenses create hardship quickly.`;
        } else {
          baselineNote = `This household manages on a fixed income while supporting ${children === 1 ? "a child" : "children"}. Benefits provide essential support, but the margin for emergencies is thin.`;
        }
      } else if (isMixedIncome) {
        if (isChildless) {
          baselineNote = `This ${isSingle ? "individual has" : "household has"} a mix of employment and retirement income. The working income provides some flexibility, but rising costs and the needs of aging members add vulnerability.`;
        } else {
          baselineNote = `This household balances employment wages and retirement income while supporting ${children === 1 ? "a child" : "children"}. The working income helps, but the needs of both younger and older members stretch the budget.`;
        }
      } else if (isElderly) {
        if (isChildless) {
          baselineNote = `Despite having ${isSingle ? "an" : "a"} working-age adult, this household includes ${adultsOver65 === 1 ? "a member" : "members"} over 65 with healthcare needs that add financial pressure.`;
        } else {
          baselineNote = `This household has employment income and includes ${adultsOver65 === 1 ? "an adult" : "adults"} over 65 while supporting ${children === 1 ? "a child" : "children"}. They're working, but the combination of childcare and aging-related costs makes the budget tight.`;
        }
      } else if (isChildless) {
        if (isSingle) {
          baselineNote = `This individual starts at a modest baseline stability level. Current income ${income < 2500 ? "barely covers" : "covers"} basic expenses, but there is little cushion for emergencies like a medical bill or car repair.`;
        } else {
          baselineNote = `This household starts at a modest baseline stability level. Combined income ${income < 4000 ? "barely covers" : "covers"} basic expenses, with limited room for unexpected costs.`;
        }
      } else {
        baselineNote = `This family starts at a modest baseline stability level. With current benefits and income, they can meet basic expenses but have little margin for emergencies.`;
      }

      const statusNote = fullyUndocumented

        : undefined;

        ? `Monthly earned income: ${formatMoney(income)}`
        : `Combined monthly earned income: ${formatMoney(income)}`;

      return { story, baselineNote, incomeNote, statusNote };

    function Logo({ size = "normal" }) {
      const h = size === "small" ? "80px" : "100px";
      return (
        <a href="https://www.mboldenchange.org" style={{ display: 'inline-block' }}>
          <img src={LOGO_SRC} alt="mBOLDen Change" style={{ height: h, width: 'auto' }} />
        </a>
      );
    }

    // ─── UI Components ────────────────────────────────────────────────────────

    function ProgressBar({ current, total }) {
      const getBarColor = (i) => {
        if (i > current) return "bg-gray-200";
        const pct = i / Math.max(total - 1, 1);
        if (i === current) return "bg-amber-400";
        if (pct < 0.33) return "bg-emerald-400";
        if (pct < 0.66) return "bg-amber-400";
        return "bg-red-500";
      };
      return (
        <div className="flex items-center gap-3 mb-6" role="progressbar" aria-valuenow={current + 1} aria-valuemin={1} aria-valuemax={total} aria-label={`Policy round ${current + 1} of ${total}`}>
          <span className="text-xs font-medium text-gray-400" style={{fontFamily: "'Archivo Narrow', sans-serif"}}>Round {current + 1} of {total}</span>
          <div className="flex items-center gap-1.5 flex-1">
            {Array.from({ length: total }).map((_, i) => (
              <div key={i} className={`h-2 flex-1 rounded-full transition-all duration-500 ${getBarColor(i)}`} />
            ))}
          </div>
        </div>
      );
    }

    function SeverityDots({ severity, size }) {
      const [showTip, setShowTip] = useState(false);
      const sevColors = { 1: "#FACC15", 2: "#FB923C", 3: "#EF4444" };
      const sevLabels = { 1: "Lower impact on stability", 2: "Moderate impact on stability", 3: "Severe impact on stability" };
      const dotSize = size === "lg" ? "w-3 h-3" : "w-2.5 h-2.5";
      return (
        <div className="relative flex mt-2" style={{cursor: 'pointer', width: 'fit-content'}}
          role="img" aria-label={`Severity: ${severity} of 3 — ${sevLabels[severity]}`}
          onClick={(e) => { e.stopPropagation(); setShowTip((p) => !p); }}
          onMouseEnter={() => setShowTip(true)} onMouseLeave={() => setShowTip(false)}>

          {showTip && <div className="sev-tooltip">{sevLabels[severity]}</div>}

    function QualityOfLifeMeter({ score, label, showDefinition }) {

            <span className="text-xs font-mono text-gray-500">{Math.round(score)}%</span>
          </div>
        </div>
      );
    }

    function BudgetBar({ income, expenses, benefits }) {

          <div className="space-y-2">
            {[["Income", income, "bg-blue-400"], ["Support", benefits, "bg-emerald-400"], ["Expenses", expenses, "bg-red-400"]].map(([label, val, bg]) => (

    // ─── Household Builder Wizard ──────────────────────────────────────────────

    function HouseholdBuilder({ onComplete, onCancel }) {
      const [step, setStep] = useState(1);
      const [config, setConfig] = useState({
        name: "Your Household",
        adults: 1,
        children: 0,
        childrenAges: [],
        income: 2000,
        mixedStatus: false,
        fullyUndocumented: false,
        adultsOver65: 0,
        incomeSource: "employment",
        hasDisabledChild: false,
        region: null,
        customExpenses: null,
      });

      const handleInputChange = (field, value) => {
        const newConfig = { ...config, [field]: value };
        if (field === "children") {
          newConfig.childrenAges = Array(value).fill("under5");
          if (value === 0) newConfig.hasDisabledChild = false;
        }
        // Reset custom expenses when household composition changes (they'll be recalculated)
        if (field === "adults" || field === "children" || field === "region") {
          newConfig.customExpenses = null;
        }
        // Cap adultsOver65 when adults decrease
        if (field === "adults" && (newConfig.adultsOver65 || 0) > value) {
          newConfig.adultsOver65 = value;
        }
        setConfig(newConfig);
      };

      const handleAgeChange = (index, age) => {
        const newAges = [...config.childrenAges];
        newAges[index] = age;
        setConfig({ ...config, childrenAges: newAges });
      };

      const rawExpenses = estimateExpenses(config.adults, config.children, config.children > 0, config.fullyUndocumented);
      const preRegionExpenses = config.customExpenses || (config.region ? adjustExpenses(rawExpenses, config.region) : rawExpenses);
      const eligibility = calculateEligibility(
        config.income,
        config.adults,
        config.children,
        config.childrenAges.map(a => a === "under5" ? 3 : a === "5-12" ? 9 : 15),
        config.mixedStatus,
        config.adultsOver65 || 0,
        {
          incomeSource: config.incomeSource || "employment",
          childcareCost: preRegionExpenses.childcare || 0,
          housingCost: preRegionExpenses.housing || 0,
          medicalCost: (preRegionExpenses.healthcare || 0) + (preRegionExpenses.medications || 0),
          fullyUndocumented: config.fullyUndocumented || false,
        }
      );

      // Disability waiver: children with disabilities qualify for Medicaid regardless of family income
      // Models Katie Beckett / TEFRA waiver pathway — evaluates child's disability, not family income
      if (config.hasDisabledChild && config.children > 0) {
        const waiverValue = config.children * 600;
        if (!eligibility.medicaid.eligible || eligibility.medicaid.default === 0) {
          // No existing Medicaid — add childMedicaid via disability waiver
          eligibility.childMedicaid = { eligible: true, default: waiverValue, min: 0, max: waiverValue, note: "Qualifies through disability waiver (Katie Beckett/TEFRA) — evaluates child's disability, not family income" };
        }
      }

      const baseExpenses = preRegionExpenses;
      const cashBenefits = Object.entries(eligibility).reduce((sum, [key, val]) => {
        if (!SERVICE_COVERAGE_KEYS.includes(key) && !val.isAnnual && val.eligible) return sum + val.default;
        return sum;
      }, 0);
      const baselineQuality = calculateBaselineQuality(config.income, cashBenefits, baseExpenses, config.mixedStatus || config.fullyUndocumented, (config.adultsOver65 || 0) > 0, config.incomeSource, config.fullyUndocumented);

      const totalEligibleCount = Object.values(eligibility).filter(v => v.eligible && !v.isAnnual).length;
      const totalBenefitValue = Object.entries(eligibility).reduce((sum, [key, val]) => {
        if (val.eligible && !val.isAnnual) return sum + val.default;
        return sum;
      }, 0);
      const fplMonthly = calculateFPL(config.adults + config.children) / 12;
      const isHighIncome = config.income > fplMonthly * 4 && totalEligibleCount <= 2 && totalBenefitValue < 200;

      // High-income households get a very high stability score
      const highIncomeQuality = (() => {
        const expTotal = getExpenseTotal(baseExpenses);
        const ratio = expTotal > 0 ? config.income / expTotal : 2;
        if (ratio >= 5) return 97;
        if (ratio >= 3) return 95;
        if (ratio >= 2) return 92;
        if (ratio >= 1.5) return 88;
        if (ratio >= 1.3) return 78;
        if (ratio >= 1.15) return 68;
        return 58;
      })();

      const storyData = generateCustomStory({
        name: config.name,
        adults: config.adults,
        children: config.children,
        income: config.income,
        mixedStatus: config.mixedStatus,
        fullyUndocumented: config.fullyUndocumented,
        childrenAges: config.childrenAges,
        adultsOver65: config.adultsOver65,
        incomeSource: config.incomeSource,
        hasDisabledChild: config.hasDisabledChild,
      });

      const finalBenefits = Object.entries(eligibility).reduce((acc, [key, val]) => {
        if (val.eligible && val.default > 0 && !val.isAnnual) acc[key] = val.default;
        return acc;
      }, {});

      const createHousehold = () => {
        const household = {
          id: "custom-" + Date.now(),
          name: config.name,
          description: config.children > 0
            ? `${config.adults} adult${config.adults !== 1 ? "s" : ""}, ${config.children} child${config.children !== 1 ? "ren" : ""}. Monthly income: ${formatMoney(config.income)}.`

          monthlyIncome: config.income,
          members: config.adults + config.children,
          mixedStatus: config.mixedStatus,
          fullyUndocumented: config.fullyUndocumented || false,
          baselineQuality,
          baselineNote: storyData.baselineNote,
          benefits: finalBenefits,
          annualCredits: {
            ctc: eligibility.ctc.eligible ? eligibility.ctc.default : 0,
            eitc: eligibility.eitc.eligible ? eligibility.eitc.default : 0,
            ctcNote: (config.mixedStatus || config.fullyUndocumented) ? "ITIN filers cannot claim CTC under current law" : "Child Tax Credit refundable portion",
            eitcNote: (config.mixedStatus || config.fullyUndocumented) ? "ITIN filers are not eligible for EITC" : "Earned Income Tax Credit",
          },
          expenses: baseExpenses,
          customRegion: config.region,
          story: storyData.story,
          incomeNote: storyData.incomeNote,
          statusNote: storyData.statusNote,
          isCustom: true,
          adults: config.adults,
          children: config.children,
          childrenAges: config.childrenAges,
          adultsOver65: config.adultsOver65 || 0,
          incomeSource: config.incomeSource || "employment",
        };
        onComplete(household);
      };

      let steps = [
        {
          title: "Tell us about your family",
          content: (

                <input

                  className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-3">Number of adults</label>
                <div className="flex gap-4">
                  {[1, 2].map((n) => (
                    <button
                      key={n}
                      onClick={() => handleInputChange("adults", n)}
                      className={`px-6 py-2 rounded-lg font-medium transition-all ${
                        config.adults === n
                          ? "bg-teal-600 text-white"
                          : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                      }`}
                    >
                      {n === 1 ? "1 adult" : "2 adults"}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-3">How many adults are age 65 or older?</label>
                <div className="flex gap-4">
                  {Array.from({length: config.adults + 1}, (_, i) => i).map((n) => (
                    <button
                      key={n}
                      onClick={() => handleInputChange("adultsOver65", n)}
                      className={`px-6 py-2 rounded-lg font-medium transition-all ${
                        (config.adultsOver65 || 0) === n
                          ? "bg-teal-600 text-white"
                          : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                      }`}
                    >
                      {n}
                    </button>
                  ))}
                </div>
                {(config.adultsOver65 || 0) > 0 && (
                  <p className="text-xs text-gray-500 mt-2">Adults 65+ may qualify for Medicare and nutrition programs like Meals on Wheels.</p>
                )}
              </div>

              {(config.adultsOver65 || 0) > 0 && (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-3">What is this household's primary income source?</label>
                  <div className="flex gap-3 flex-wrap">
                    {[
                      { value: "employment", label: "Employment wages" },
                      { value: "retirement", label: "Social Security / retirement" },
                      { value: "mixed", label: "Mix of both" },
                    ].map((opt) => (
                      <button
                        key={opt.value}
                        onClick={() => handleInputChange("incomeSource", opt.value)}
                        className={`px-5 py-2 rounded-lg font-medium transition-all text-sm ${
                          config.incomeSource === opt.value
                            ? "bg-teal-600 text-white"
                            : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                        }`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                  <p className="text-xs text-gray-500 mt-2">
                    {config.incomeSource === "employment" ? "This household has working-age income earners." : config.incomeSource === "retirement" ? "This household relies on fixed income from Social Security or pensions." : "This household has a mix of employment wages and retirement income."}
                  </p>
                </div>
              )}

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-3">Number of children</label>
                <select
                  value={config.children}
                  onChange={(e) => handleInputChange("children", parseInt(e.target.value))}

                    {config.childrenAges.map((age, i) => (
                      <select

                      >

                        <option value="13-17">13-17</option>

                  )}

              )}

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">Combined monthly earned income</label>
                <div className="flex items-center gap-2">
                  <span className="text-gray-600">$</span>

                    step="100"
                  />

                <p className="text-xs text-gray-500 mt-2">Income at or below federal poverty line (~{formatMoney(calculateFPL(config.adults + config.children))} for your household) = income-based benefits</p>

              <div>

                      <input

                        name="status"
                        checked={isSelected}

                          if (opt.id === "citizen") setConfig(c => ({ ...c, mixedStatus: false, fullyUndocumented: false }));
                          else if (opt.id === "mixed") setConfig(c => ({ ...c, mixedStatus: true, fullyUndocumented: false }));
                          else setConfig(c => ({ ...c, mixedStatus: false, fullyUndocumented: true }));
                        }}
                        className="mt-1"
                      />
                      <div>
                        <div className="font-medium text-gray-900">{opt.label}</div>
                        <div className="text-xs text-gray-600">{opt.desc}</div>

                    </label>
                    );
                  })}
                </div>
              </div>
            </div>
          ),
        },
        {

                    <div className="flex items-start justify-between mb-2">
                      <div>
                        <h4 className="font-medium text-gray-900">{displayName}</h4>
                        <p className="text-xs text-gray-600 mt-1">{val.note || "Program eligibility"}</p>
                      </div>
                      <span className={`text-2xl ${val.eligible ? "text-emerald-600" : "text-gray-300"}`}>
                        {val.eligible ? "✓" : "✕"}
                      </span>
                    </div>
                    {val.eligible && val.default > 0 && (
                      <div className="flex items-center gap-2 mt-3 pt-3 border-t border-emerald-200">
                        <span className="text-xs text-gray-600">Estimated monthly:</span>
                        <span className="font-bold text-emerald-700">{formatMoney(val.default)}</span>
                      </div>
                    )}
                  </div>
                );
              })}
              {(eligibility.ctc.eligible || eligibility.eitc.eligible || config.mixedStatus || config.fullyUndocumented || config.children > 0) && (
                <div className={`p-4 border-2 rounded-lg mt-6 ${(eligibility.ctc.eligible || eligibility.eitc.eligible) ? "border-blue-300 bg-blue-50" : "border-gray-200 bg-gray-50"}`}>

                      }

                  const adj = adjustExpenses(rawExpenses, r);

                  const baseTotal = getExpenseTotal(rawExpenses);
                  const diff = adjTotal - baseTotal;
                  return (
                    <button
                      key={r.id}
                      onClick={() => {
                        setConfig((prev) => ({ ...prev, region: r, customExpenses: null }));
                      }}
                      className={`w-full text-left rounded-xl p-4 border-2 transition-all ${
                        config.region && config.region.id === r.id
                          ? "border-teal-500 bg-teal-50"
                          : r.isDefault && !config.region
                          ? "border-gray-300 bg-white"
                          : "border-gray-100 bg-white hover:border-gray-400"

                    >
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="font-bold text-gray-900">
                            {r.name}

                          <p className="text-xs text-gray-500 mt-0.5">{r.example}</p>
                        </div>
                        <div className="text-right">
                          <div className="text-sm font-mono">
                            {diff === 0 ? (
                              <span className="text-gray-400">baseline</span>
                            ) : diff > 0 ? (
                              <span className="text-red-600">+{formatMoney(diff)}/mo</span>
                            ) : (
                              <span className="text-emerald-600">{formatMoney(diff)}/mo</span>
                            )}
                          </div>
                          <div className="text-xs text-gray-400">

                          </div>
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mt-2">
                <p className="text-xs text-amber-800">
                  <strong>Note:</strong> Benefit eligibility is based on Federal Poverty Level thresholds, which are national — they do not adjust for regional cost of living. A family earning $100,000 in San Francisco faces the same eligibility rules as a family earning $100,000 in rural Mississippi, even though their financial realities are vastly different.

        {

          ),

        {
          title: "Review and start",
          content: (
            <div className="space-y-4">

                  <div className="flex justify-between">
                    <span className="text-gray-600">Monthly benefits:</span>
                    <span className="font-semibold text-emerald-600">{formatMoney(cashBenefits)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Monthly expenses:</span>

                  <div className="flex justify-between">

                  </div>
                  <hr className="my-2" />
                  <div className="flex justify-between items-center">
                    <span className="text-gray-600">Starting stability:</span>
                    <div className="flex items-center gap-2">
                      <div className="w-24 bg-gray-200 rounded-full h-2">
                        <div
                          className={`h-full rounded-full ${
                            baselineQuality >= 58 ? "bg-green-500" : baselineQuality >= 45 ? "bg-yellow-500" : "bg-red-500"

                          style={{ width: `${baselineQuality}%` }}
                        />
                      </div>
                      <span className="font-bold">{baselineQuality}%</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-900">
                <p><strong>Ready to start?</strong> Click below to enter the simulation with this household and see how policy cuts affect them.</p>
              </div>
            </div>
          ),
        },
      ];

      // Insert high-income awareness gate after Step 2 — this becomes the TERMINAL step
      const isAwarenessGateStep = isHighIncome && step === 3;
      if (isHighIncome) {
        // Replace remaining steps with just the awareness gate
        steps.splice(2, steps.length - 2, {
          title: "About this household",
          content: (
            <div className="space-y-6">

                  </div>
                  <div>
                    <h3 className="font-bold text-lg" style={{fontFamily: "'Archivo Narrow', sans-serif", color: '#166534'}}>This household is financially stable</h3>
                    <p className="text-sm text-green-700">Estimated stability: <strong>{highIncomeQuality}%</strong></p>
                  </div>

                <div className="w-full bg-green-200 rounded-full h-3 mb-4">
                  <div className="h-full rounded-full bg-green-500" style={{ width: `${highIncomeQuality}%` }} />
                </div>
                <p className="text-sm text-gray-700 leading-relaxed mb-3">
                  {totalEligibleCount === 0
                    ? <>Based on your household's income of <strong>{formatMoney(config.income)}/month</strong> ({formatMoney(config.income * 12)}/year), this family doesn't qualify for any safety net programs. These programs are designed for families who need them — and at this income level, the safety net simply doesn't apply.</>
                    : <>Based on your household's income of <strong>{formatMoney(config.income)}/month</strong> ({formatMoney(config.income * 12)}/year), this family qualifies for very little from the safety net. That's the system working as intended — these programs target families who need them most.</>

      const currentStep = steps[step - 1];
      const isLastStep = step === steps.length;

      return (
        <div className="max-w-2xl mx-auto py-6">

            <div className="flex items-center gap-2 mb-3">

    const HOUSEHOLD_ACCENTS = { "single-mom": "#0091AD", "elderly-couple": "#0091AD", "working-family": "#0091AD", "mixed-status": "#B22F93", "middle-class": "#0091AD" };

    function HouseholdSelect({ onSelect, showBuilder }) {

        <div className="max-w-5xl mx-auto py-6">

          <p className="text-gray-500 mb-6">Each household depends on different programs. Your experience will vary.</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {HOUSEHOLDS.map((hh) => {
              const bt = getCashBenefitTotal(hh.benefits);
              const et = getExpenseTotal(hh.expenses);
              const accent = HOUSEHOLD_ACCENTS[hh.id] || "#0091AD";
              return (
                <button key={hh.id} onClick={() => onSelect(hh)} className="w-full text-left rounded-xl p-5 border-2 transition-all group flex flex-col" style={{borderLeftWidth: '4px', borderLeftColor: accent, background: 'var(--card-bg)', borderColor: 'var(--card-border)'}}>
                  <div className="flex-1">

                  </div>

            {showBuilder && (

                style={{borderColor: 'var(--card-border)', background: 'var(--card-bg)'}}
                style={{borderLeftWidth: '4px', borderLeftColor: 'transparent'}}
              >
                <div className="flex-1">
                  <h3 className="font-bold text-lg group-hover:text-black" style={{fontFamily: "'Archivo Narrow', sans-serif", color: '#0091AD'}}>
                    Build Your Own Household
                    <span className="ml-2 px-2 py-0.5 text-xs font-medium rounded-full align-middle" style={{backgroundColor: '#FEF3C7', color: '#92400E', fontSize: '0.65rem', letterSpacing: '0.05em'}}>BETA</span>
                  </h3>
                  <p className="text-sm text-gray-600 mt-1">Customize income, family size, and immigration status to explore how the safety net works for different families.</p>
                </div>
              </button>

          </div>
        </div>
      );
    }

    function RegionSelect({ household, onSelect, caState, onCaToggle, medicalEnrolledPreFreeze, onMedicalEnrollment, calworksApplied, onCalworksApplied }) {
      const regions = caState ? CA_SUBREGIONS : REGIONS;
      return (
        <div className="max-w-3xl mx-auto py-6">
          <h2 className="text-2xl font-bold mb-2" style={{fontFamily: "'Archivo Narrow', sans-serif"}}>Where does this family live?</h2>
          <p className="text-gray-500 mb-1">Cost of living changes the math. Housing is the biggest variable.</p>
          <p className="text-xs text-gray-400 mb-1">Multipliers based on 2023 BEA Regional Price Parities and FY2025 HUD Fair Market Rent data.</p>
          {!caState && <p className="text-xs text-gray-400 mb-4 italic">Income is held constant across regions. Federal benefits don't adjust for local wages or cost of living — that's part of the problem.</p>}
          {caState && <p className="text-xs text-gray-400 mb-4 italic">California wages and expenses are both adjusted by sub-region. Documented workers receive the full regional wage premium; undocumented/mixed-status workers receive a partial premium (50%) reflecting market-driven wage increases offset by wage theft and cash-pay arrangements.</p>}
